/* ---------- réorganisation en catégories / sous-catégories ---------- */
function applyStructure(){
  snap('réorganisation des catégories');
  const ordre=[];
  STRUCT.forEach(st=>{
    let target=S.cats.find(c=>c.id===st.id);
    const srcs=st.from.map(f=>S.cats.find(c=>c.id===f)).filter(Boolean);
    if(!target){
      const base=srcs[0];
      target={id:st.id, em:st.em, grp:st.grp, budget:base?(base.budget||0):0,
              report:base?base.report!==false:true, subs:[]};
      S.cats.push(target);
    }
    target.grp=st.grp;
    if(!target.em||target.em==='•') target.em=st.em;
    normSubs(target);
    st.subs.forEach(n=>{ if(!target.subs.some(x=>x.n===n)) target.subs.push({n, b:0}); });
    st.from.forEach(f=>{
      if(f===st.id) return;
      const src=S.cats.find(c=>c.id===f);
      S.tx.forEach(t=>{
        if(t.c===f){
          t.c=st.id;
          if(!t.s) t.s = st.subs.includes(f) ? f : (st.ren[f] || '');
        }
      });
      Object.values(S.months).forEach(m=>{
        if(m.b && m.b[f]!=null){ if(m.b[st.id]==null) m.b[st.id]=m.b[f]; delete m.b[f]; }
      });
      if(src){
        if(!target.budget && src.budget) target.budget=src.budget;
        S.cats=S.cats.filter(c=>c.id!==f);
      }
    });
    ordre.push(st.id);
  });
  /* remettre dans l'ordre : structure d'abord, puis les catégories perso */
  const dans=id=>ordre.indexOf(id);
  S.cats.sort((x,y)=>{
    const a=dans(x.id), b=dans(y.id);
    if(a<0 && b<0) return 0;
    if(a<0) return 1;
    if(b<0) return -1;
    return a-b;
  });
  S.structApplied=true;
  save(); bust(); render();
  toast('Catégories réorganisées', true);
}

/* ---------- annulation ---------- */
let UNDO=[];
function snap(label){
  try{ UNDO.push({s:JSON.stringify(S), l:label}); if(UNDO.length>25) UNDO.shift(); }catch(e){}
}
function undo(){
  const u=UNDO.pop();
  if(!u){ toast('Rien à annuler'); return; }
  S=JSON.parse(u.s);
  if(!Array.isArray(S.debts)) S.debts=[];
  S.cats.forEach(c=>{ normSubs(c); syncCatBudget(c); });
  /* les remboursements rattachés à une dépense se déduisent désormais de la dépense */
  S.debts.forEach(d=>{
    if(d.paid && d.tx && d.rev && d.rk && S.months[d.rk]){
      S.months[d.rk].rev=(S.months[d.rk].rev||[]).filter(r=>r.id!==d.rev);
      d.rev=null; d.rk=null;
    }
  });
  save(); bust(); render(); toast('Annulé : '+u.l);
}

function payDebt(id){
  const d=debts().find(x=>x.id===id); if(!d||d.paid) return;
  snap('remboursement');
  d.paid=true; d.pd=new Date().toISOString().slice(0,10); d.rev=null; d.rk=null;
  if(!d.tx){
    /* prêt d'argent sans dépense enregistrée : le remboursement est un revenu */

function unpayDebt(id){
  const d=debts().find(x=>x.id===id); if(!d||!d.paid) return;
  snap('annulation de remboursement');
  if(d.rev && d.rk && S.months[d.rk]) S.months[d.rk].rev=S.months[d.rk].rev.filter(r=>r.id!==d.rev);

/* ---------- recherche globale ---------- */
let HILITE=null;
const norm = s => (s==null?'':String(s)).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function mark(txt, q){
  const t=String(txt||''); if(!q) return esc(t);
  const i=norm(t).indexOf(q); if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
function search(qRaw){
  const q=norm(qRaw).trim();
  if(!q) return [];
  const num=parseFloat(qRaw.replace(',','.'));
  const numOk=isFinite(num)&&/[0-9]/.test(qRaw);
  const out=[];
  S.tx.forEach(t=>{
    const hay=[t.n,t.c,t.s,t.pm].filter(Boolean);
    const hit=hay.some(h=>norm(h).includes(q)) || (numOk && Math.abs(t.a-num)<0.005);
    if(hit) out.push({kind:'dep', id:t.id, k:t.d.slice(0,7), d:t.d,
      titre:t.n||t.c, sous:[t.n?t.c:(t.imp?"importé de l'Excel":''), t.s||''].filter(Boolean).join(' · '), a:netA(t), em:cat(t.c).em});
  });
  Object.keys(S.months).forEach(k=>{
    (S.months[k].rev||[]).forEach(r=>{
      const hay=[r.l,r.n,r.pm].filter(Boolean);
      const hit=hay.some(h=>norm(h).includes(q)) || (numOk && Math.abs(r.a-num)<0.005);
      if(hit) out.push({kind:'rev', id:r.id, k, d:k+'-01', titre:r.l, sous:r.n||'', a:r.a, em:'💶'});
    });
  });
  out.sort((x,y)=> x.d===y.d ? 0 : (x.d<y.d?1:-1));
  return out;
}
function runSearch(){
  const qRaw=el('qInput').value;
  const q=norm(qRaw).trim();
  const res=search(qRaw);
  const box=el('qRes');
  if(!q){
    el('qCount').textContent='Cherche dans tes notes, tes catégories et tes libellés, sur tous les mois.';
    box.innerHTML=''; return;
  }
  const totD=r2(res.reduce((s,r)=>s+(r.kind==='dep'?r.a:0),0));
  const totR=r2(res.reduce((s,r)=>s+(r.kind==='rev'?r.a:0),0));
  if(!res.length) el('qCount').textContent='Aucun résultat.';
  else el('qCount').innerHTML = `${res.length} résultat${res.length>1?'s':''}`
    + (totD>0?` · <b>${fmt(totD)}</b> de dépenses`:'')
    + (totR>0?` · <b style="color:var(--brand)">${fmt(totR)}</b> de revenus`:'');
  box.innerHTML = res.slice(0,200).map(r=>`
    <button type="button" class="sres" data-res="${r.kind}:${r.id}:${r.k}">
      <div class="ico">${r.em}</div>
      <div class="m"><div class="n">${mark(r.titre,q)}</div>${r.sous?`<div class="c">${mark(r.sous,q)}</div>`:''}</div>
      <div class="a tnum"><span style="color:${r.kind==='rev'?'var(--brand)':'inherit'}">${r.kind==='rev'?sgn(r.a):fmt(r.a)}</span><span class="mo">${mLabel(r.k,true)}</span></div>
    </button>`).join('')
    + (res.length>200?'<p class="hint" style="text-align:center">200 premiers résultats affichés.</p>':'');
}

    return;
  }
  if(t.dataset.pm!==undefined && t.closest('#txPay')){
    PMSEL = (PMSEL===t.dataset.pm) ? '' : t.dataset.pm;
    el('txPay').querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.pm===PMSEL)));
    return;
  }
  if(t.dataset.subdel!==undefined){
    const R=subRef(t.dataset.subdel); if(!R) return;
    const nom=R.s.n, cid=R.c.id;
    const n=S.tx.filter(x=>x.c===cid && (x.s||'')===nom).length;
    if(n && !confirm(`« ${nom} » contient ${n} dépense(s). Elles resteront dans « ${cid} » sans sous-catégorie. Continuer ?`)) return;
    snap('suppression de sous-catégorie');
    S.tx.forEach(x=>{ if(x.c===cid && (x.s||'')===nom) x.s=''; });
    R.c.subs.splice(R.si,1);
    syncCatBudget(R.c);
    save(); bust(); render(); toast('Sous-catégorie supprimée', true); return;
  }
  if(t.dataset.subadd!==undefined){
    const c=cat(t.dataset.subadd); normSubs(c);
    const nom=prompt(`Nouvelle sous-catégorie dans « ${c.id} » :`);
    if(!nom||!nom.trim()) return;
    const v=nom.trim();
    if(c.subs.some(s=>s.n===v)){ toast('Elle existe déjà'); return; }
    snap('ajout de sous-catégorie');
    c.subs.push({n:v, b:0}); save(); bust(); render(); return;
  }
  if(t.dataset.addcat!==undefined){
    const nom=prompt('Nom de la nouvelle catégorie :');
    if(!nom||!nom.trim()) return;
    const v=nom.trim();
    if(S.cats.some(c=>c.id===v)){ toast('Cette catégorie existe déjà'); return; }
    snap('ajout de catégorie');
    S.cats.push({id:v, em:'•', grp:t.dataset.addcat, budget:0, report:true, subs:[]});
    save(); bust(); render(); return;
  }
  if(t.dataset.undo!==undefined){ undo(); return; }
  if(t.dataset.drm!==undefined){ DROWS.splice(+t.dataset.drm,1); if(SHARE!=='custom') applyShare(); else renderDebtRows(); return; }
  if(t.dataset.edittx){
    if(SEL.size){ toggleSel('d:'+t.dataset.edittx); return; }
    openTx('dep', t.dataset.edittx); return;
  }
  if(t.dataset.editrev){
    if(SEL.size){ toggleSel('r:'+t.dataset.editrev); return; }
    openTx('rev', t.dataset.editrev); return;
  }
  if(t.dataset.selact){
    const a2=t.dataset.selact;
    if(a2==='close'){ SELOPEN=false; renderBubble(); }
    else if(a2==='all'){ selAll(); }
    else if(a2==='copy'){ selCopy(); }
    else if(a2==='del'){ selDelete(); }
    return;
  }
  if(t.dataset.share){ setShare(t.dataset.share); return; }
  if(t.dataset.pay){ payDebt(t.dataset.pay); return; }
  if(t.dataset.unpay){ unpayDebt(t.dataset.unpay); return; }
  if(t.dataset.deldebt){ snap('suppression d\'une créance'); S.debts=debts().filter(d=>d.id!==t.dataset.deldebt); save(); bust(); render(); toast('Ligne supprimée', true); return; }
  if(t.dataset.res){ const [kd,id,k]=t.dataset.res.split(':'); gotoResult(kd,id,k); return; }
  if(t.dataset.kind){ setKind(t.dataset.kind); return; }
  if(t.dataset.rl){
    el('revLbl2').value = t.dataset.rl==='Autre' ? '' : t.dataset.rl;
    el('revChips').querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', String(b===t)));
    if(t.dataset.rl==='Autre') el('revLbl2').focus();
    return;
  }
  if(t.dataset.catf){
    TAB='tx'; FILTER=t.dataset.catf; FSUB=(t.dataset.subf!==undefined?t.dataset.subf:null); render();
    requestAnimationFrame(()=>{ const n=el('cardDep'); if(n) n.scrollIntoView({behavior:'smooth',block:'start'}); });
    return;
  }
  if(t.dataset.jump!==undefined){
    const [tab,anchor]=t.dataset.jump.split(':');
    TAB=tab; FILTER=null; FSUB=null; render();
    requestAnimationFrame(()=>{
      const n=anchor && el(anchor);
      if(n) n.scrollIntoView({behavior:'smooth',block:'start'});
      else window.scrollTo({top:0,behavior:'smooth'});
    });
    return;
  }
  if(t.dataset.rmode){ S.reportMode=t.dataset.rmode; save(); bust(); render(); return; }
  if(t.dataset.tab){ if(SEL.size) clearSel(); TAB=t.dataset.tab; FILTER=null; FSUB=null; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.c!==undefined && t.closest('#txCats')){
    el('txCats').querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', String(b===t)));
    SUBSEL=''; renderSubChips();
    return;
  }
  if(t.dataset.filter!==undefined){
    const nf=t.dataset.filter||null;
    const ns=t.dataset.subf!==undefined?t.dataset.subf:null;
    if(nf===FILTER && ns===FSUB && ns!==null) FSUB=null; else { FILTER=nf; FSUB=nf?ns:null; }
    renderTx(); return;
  }
  if(t.dataset.hcat){ HCAT=t.dataset.hcat; renderHist(); return; }
  if(t.dataset.goto){ CUR=t.dataset.goto; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.deltx){
    snap('suppression de dépense');
    S.tx=S.tx.filter(x=>x.id!==t.dataset.deltx);
    debts().filter(d=>d.tx===t.dataset.deltx && d.paid).forEach(d=>unpayDebt(d.id));
    S.debts=debts().filter(d=>d.tx!==t.dataset.deltx);
    save(); render(); toast('Dépense supprimée', true); return; }
  if(t.dataset.delrev){ snap('suppression de revenu'); const M=S.months[CUR]; if(M){M.rev=M.rev.filter(r=>r.id!==t.dataset.delrev);} save(); render(); toast('Revenu supprimé', true); return; }
  if(t.dataset.cdel){
    const id=t.dataset.cdel;
    const n=S.tx.filter(x=>x.c===id).length;
    if(n && !confirm(`« ${id} » contient ${n} dépense(s). Elles seront déplacées vers « Divers ». Continuer ?`)) return;
    S.tx.forEach(x=>{ if(x.c===id) x.c='Divers'; });
    if(!S.cats.some(c=>c.id==='Divers')) S.cats.push({id:'Divers',em:'✨',grp:'l',budget:0,report:true});
    S.cats=S.cats.filter(c=>c.id!==id);
    save(); render(); return;
  }
  const a=t.dataset.act;
  if(a==='addtx'){ openTx('dep'); }
  else if(a==='addrev'){ openTx('rev'); }
  else if(a==='struct'){ applyStructure(); }
  else if(a==='nostruct'){ S.structApplied=true; save(); render(); }
  else if(a==='adddebt'){
    el('ndWho').value=''; el('ndAmt').value=''; el('ndNote').value='';
    el('ndDate').value=new Date().toISOString().slice(0,10);
    el('whoList2').innerHTML=people().map(w=>`<option value="${esc(w)}">`).join('');
    el('dlgDebt').showModal(); setTimeout(()=>el('ndWho').focus(),50);
  }
  else if(a==='clearadj'){
    if(S.months[CUR]) S.months[CUR].adj=0;
    save(); bust(); el('dlgSolde').close(); render(); toast('Ajustement retiré');
  }
  else if(a==='resetreport'){
    S.reportFrom = CUR; save(); bust(); render(); toast('Reports remis à zéro');
  }
  else if(a==='clearfrom'){ S.reportFrom=null; save(); bust(); render(); }
  else if(a==='export'){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const dl=document.createElement('a');
    dl.href=url; dl.download='finances-'+new Date().toISOString().slice(0,10)+'.json'; dl.click();
    URL.revokeObjectURL(url); toast('Fichier exporté');
  }
  else if(a==='csv'){
    const rows=[['date','categorie','groupe','montant','note']];
    S.tx.slice().sort((x,y)=>x.d<y.d?-1:1).forEach(t=>rows.push([t.d,t.c,GRP_NAME[cat(t.c).grp],String(t.a).replace('.',','),t.n||'']));
    const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    const dl=document.createElement('a'); dl.href=url; dl.download='depenses.csv'; dl.click(); URL.revokeObjectURL(url);
  }
  else if(a==='import'){ el('fileIn').click(); }
  else if(a==='reset'){
    if(!confirm('Effacer définitivement toutes les données de cette application ? Pense à exporter avant.')) return;
    S=buildFromSeed(); save(); CUR=null; render(); toast('Données réinitialisées');
  }
});

document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='fileIn' && t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{ try{ const p=JSON.parse(fr.result); if(!p.cats||!p.tx) throw 0; S=p; save(); CUR=null; render(); toast('Données importées'); }
      catch(err){ toast('Fichier illisible'); } };
    fr.readAsText(t.files[0]); return;
  }
  if(t.id==='solde0'){
    const v=numFR(t.value);
    if(isNaN(v)){ toast('Montant invalide'); return; }
    S.solde0=v; save(); bust(); renderHero(); renderSet(); toast('Solde de départ mis à jour'); return; }
  if(t.dataset.cbd!==undefined){ const c=cat(t.dataset.cbd); const v=numFR(t.value); c.budget=isNaN(v)?0:v; save(); bust(); renderSet(); return; }
  if(t.dataset.sbd!==undefined){
    const R=subRef(t.dataset.sbd); if(!R) return;
    const v=numFR(t.value); R.s.b=isNaN(v)?0:v;
    syncCatBudget(R.c); save(); bust(); renderSet(); return;
  }
  if(t.dataset.snm!==undefined){
    const R=subRef(t.dataset.snm); if(!R) return;
    const anc=R.s.n, nv=t.value.trim();
    if(!nv || nv===anc){ t.value=anc; return; }
    if(R.c.subs.some((x,k)=>k!==R.si && x.n===nv)){ toast('Ce nom existe déjà'); t.value=anc; return; }
    snap('renommage de sous-catégorie');
    R.s.n=nv;
    S.tx.forEach(x=>{ if(x.c===R.c.id && (x.s||'')===anc) x.s=nv; });
    save(); bust(); render(); return;
  }
  if(t.dataset.crp!==undefined){ const c=cat(t.dataset.crp); c.report=t.checked; save(); bust(); return; }
  if(t.dataset.cgr!==undefined){ const c=cat(t.dataset.cgr); c.grp=t.value; save(); bust(); return; }
  if(t.dataset.cem!==undefined){ const c=cat(t.dataset.cem); c.em=t.value.trim()||'•'; save(); return; }
  if(t.dataset.cnm!==undefined){
    const old=t.dataset.cnm, nv=t.value.trim();
    if(!nv || nv===old) return;
    if(S.cats.some(c=>c.id===nv)){ toast('Ce nom existe déjà'); t.value=old; return; }
    const c=cat(old); c.id=nv;
    S.tx.forEach(x=>{ if(x.c===old) x.c=nv; });
    Object.values(S.months).forEach(m=>{ if(m.b&&m.b[old]!=null){ m.b[nv]=m.b[old]; delete m.b[old]; } });
    if(HCAT===old) HCAT=nv;
    save(); bust(); render(); return;
  }
  if(t.dataset.mbd!==undefined){
    const M=ensureMonth(CUR); const v=t.value.trim();
    if(v==='') delete M.b[t.dataset.mbd]; else { const n=numFR(v); M.b[t.dataset.mbd]=isNaN(n)?0:n; }
    save(); bust(); return;
  }
});

el('frmTx').addEventListener('submit', e=>{
  const amt=numFR(el('txAmount').value);
  if(!isFinite(amt)||amt===0){ e.preventDefault(); toast('Indique un montant'); return; }
  const d=el('txDate').value || (CUR+'-15');
  const k=d.slice(0,7);

  if(KIND==='dep'){
    const sel=el('txCats').querySelector('[aria-pressed="true"]');
    if(!sel){ e.preventDefault(); toast('Choisis une catégorie'); return; }
    const rows = el('debtOn').checked
      ? DROWS.map(r=>({who:r.who.trim(), a:r2(numFR(r.a))}))
             .filter(r=>r.who && isFinite(r.a) && r.a>0)
      : [];
    const note=el('txNote').value.trim();

    if(EDIT && EDIT.kind==='dep'){
      snap('modification de dépense');
      const t=S.tx.find(x=>x.id===EDIT.id);
      if(t){ t.a=r2(amt); t.c=sel.dataset.c; t.s=SUBSEL||''; t.pm=PMSEL||''; t.d=d; t.n=note; t.imp=0; }
      S.debts=debts().filter(x=>!(x.tx===EDIT.id && !x.paid));
      rows.forEach(r=>debts().push({id:uid(), who:r.who, a:r.a, d, n:note, tx:EDIT.id, paid:false, pd:null, rev:null, rk:null}));
      ensureMonth(k); CUR=k; save();
      setTimeout(()=>{render(); toast('Dépense modifiée', true);},0);
    } else {
      snap('ajout de dépense');
      const tid=uid();
      S.tx.push({id:tid, d, c:sel.dataset.c, s:SUBSEL||'', pm:PMSEL||'', a:r2(amt), n:note, imp:0});
      rows.forEach(r=>debts().push({id:uid(), who:r.who, a:r.a, d, n:note, tx:tid, paid:false, pd:null, rev:null, rk:null}));
      ensureMonth(k); CUR=k; save();
      const due=r2(rows.reduce((s,r)=>s+r.a,0));
      setTimeout(()=>{render(); toast('− '+fmt(amt)+' · '+sel.dataset.c+(due?` · ${fmt(due)} dû`:''), true);},0);
    }
  } else {
    const lbl=el('revLbl2').value.trim() || 'Revenu';
    const note=el('txNote').value.trim();
    if(EDIT && EDIT.kind==='rev'){
      snap('modification de revenu');
      const src=S.months[EDIT.k];
      const r=src && (src.rev||[]).find(x=>x.id===EDIT.id);
      if(r){
        if(EDIT.k===k){ r.l=lbl; r.a=r2(amt); r.n=note; r.pm=PMSEL||''; }
        else {
          src.rev=src.rev.filter(x=>x.id!==EDIT.id);
          ensureMonth(k).rev.push({id:EDIT.id, l:lbl, a:r2(amt), n:note, pm:PMSEL||''});
        }
      }
      CUR=k; save();
      setTimeout(()=>{render(); toast('Revenu modifié', true);},0);
    } else {
      snap('ajout de revenu');
      ensureMonth(k).rev.push({id:uid(), l:lbl, a:r2(amt), n:note, pm:PMSEL||''});
      CUR=k; save();
      setTimeout(()=>{render(); toast('+ '+fmt(amt)+' · '+lbl, true);},0);
    }
  }
});

el('fab').addEventListener('click',()=>{

  else openTx('dep');
});

  const v=numFR(el('soldeVal').value);
  if(!isFinite(v)){ e.preventDefault(); return; }
  snap('correction du solde');
  const M=ensureMonth(CUR);
  M.adj = r2((M.adj||0) + (v - soldes()[CUR].fin));
  save(); bust();
  setTimeout(()=>{render(); toast('Solde corrigé');},0);
});

});

el('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')||
    (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',nx);
  try{ localStorage.setItem('fin_theme',nx); }catch(e){}

let rzW=innerWidth, rzT;
addEventListener('resize', ()=>{
  if(Math.abs(innerWidth-rzW)<30) return;
  rzW=innerWidth; clearTimeout(rzT);
  rzT=setTimeout(()=>{ if(TAB==='dash'||TAB==='hist') render(); },220);
});
addEventListener('keydown', e=>{

    e.preventDefault(); el('searchBtn').click(); return; }
  if(e.key==='n' && !/input|select|textarea/i.test(e.target.tagName) && !document.querySelector('dialog[open]')){ e.preventDefault(); openTx('dep'); }
});

/* pas de zoom : ni double-tap (touch-action), ni pincement */
['gesturestart','gesturechange','gestureend'].forEach(ev=>
  document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});

/* ===================== DÉMARRAGE ===================== */
(function init(){
  try{ const th=localStorage.getItem('fin_theme'); if(th) document.documentElement.setAttribute('data-theme',th);
       else if(matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark'); }catch(e){}
  S=load();
  S.cats.forEach(c=>{ if(c.report===undefined) c.report=true; });
  if(!Array.isArray(S.debts)) S.debts=[];
  S.cats.forEach(c=>{ normSubs(c); syncCatBudget(c); });
  /* les remboursements rattachés à une dépense se déduisent désormais de la dépense */
  S.debts.forEach(d=>{
    if(d.paid && d.tx && d.rev && d.rk && S.months[d.rk]){
      S.months[d.rk].rev=(S.months[d.rk].rev||[]).filter(r=>r.id!==d.rev);
      d.rev=null; d.rk=null;
    }
  });
  render();
})();
