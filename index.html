<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mes finances</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mes finances">
<meta name="theme-color" content="#0f5334">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{
  color-scheme: light;
  --bg:#f2f6f1; --surface:#ffffff; --surface-2:#f4f8f2; --surface-3:#eaf1e8;
  --border:#dfe7dc; --border-strong:#c8d4c4;
  --text:#122019; --text-2:#54655b; --text-3:#8b988f;
  --brand:#1b7f4f; --brand-2:#14663f; --brand-soft:#e7f3ec; --brand-ink:#0f5334;
  --s1:#1baf7a; --s2:#eb6834; --s3:#4a3aa7;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --grid:#e8eee6;
  --shadow:0 1px 2px rgba(18,32,25,.05), 0 8px 24px -12px rgba(18,32,25,.18);
  --shadow-lg:0 2px 4px rgba(18,32,25,.06), 0 20px 48px -20px rgba(18,32,25,.28);
  --r:14px; --r-sm:10px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101410; --surface:#181d18; --surface-2:#1f251f; --surface-3:#262d26;
  --border:#2c342c; --border-strong:#3c463c;
  --text:#ffffff; --text-2:#b3c0b6; --text-3:#859388;
  --brand:#35c184; --brand-2:#2aa971; --brand-soft:#16281f; --brand-ink:#7fe0b4;
  --s1:#199e70; --s2:#d95926; --s3:#9085e9;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --grid:#252c25;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 20px 48px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));
  overscroll-behavior-y:contain;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;-webkit-user-select:none;user-select:none}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px))}
header.top{
  background:linear-gradient(165deg,#0f5334 0%,#1b7f4f 60%,#25a468 100%);
  color:#fff; padding:14px 0 84px; position:relative;
}
:root[data-theme="dark"] header.top{background:linear-gradient(165deg,#0c3b26 0%,#12603c 60%,#17754a 100%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandmark{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em;font-size:15px;opacity:.95}
.brandmark svg{display:block}
.icon-btn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14);transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.24)}
.hero{margin-top:20px;text-align:center}
.hero .lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;opacity:.72;font-weight:600}
.hero .amount{font-size:clamp(40px,10vw,58px);font-weight:700;letter-spacing:-.03em;line-height:1.05;margin:4px 0 0;
  color:#fff;display:inline-flex;align-items:center;gap:10px;padding:2px 10px;border-radius:14px;transition:background .15s}
.hero .amount:hover{background:rgba(255,255,255,.13)}
.hero .amount .pen{opacity:.5;flex:none}
.hero .amount:hover .pen{opacity:.85}
.hero .delta{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:99px}
.monthnav{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px}
.monthnav button{color:#fff;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.monthnav button:hover{background:rgba(255,255,255,.24)}
.monthnav button[disabled]{opacity:.3;cursor:default}
.monthnav .m{min-width:150px;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;
  font-weight:650;font-size:14.5px;text-transform:capitalize;padding:6px 12px;border-radius:10px;transition:background .15s}
.monthnav .m:hover{background:rgba(255,255,255,.16)}
.yearnav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.yearnav button{width:36px;height:36px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-strong);display:grid;place-items:center;color:var(--text-2)}
.yearnav button:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.yearnav button:disabled{opacity:.3;cursor:default}
.yearnav .y{font-size:19px;font-weight:700;min-width:78px;text-align:center;letter-spacing:-.01em}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{padding:13px 6px 11px;border-radius:11px;border:1.5px solid var(--border-strong);background:var(--surface);
  font-size:14px;font-weight:600;text-transform:capitalize;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.mgrid button:hover:not(:disabled){border-color:var(--brand);color:var(--text)}
.mgrid button:disabled{opacity:.3;cursor:default}
.mgrid button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.mdot{width:5px;height:5px;border-radius:99px;background:var(--brand);display:block}
.mgrid button[aria-pressed="true"] .mdot{background:#fff}
.mdot.off{background:transparent}

nav.tabs{
  position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);
  margin-top:-56px;border-radius:var(--r) var(--r) 0 0;box-shadow:var(--shadow);
}
.tabs-inner{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:6px}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--text-2);white-space:nowrap;display:flex;align-items:center;gap:7px;justify-content:center;transition:.15s}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--brand-soft);color:var(--brand-ink)}
.tab .sm2{display:none}
@media(max-width:820px){
  input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{font-size:16px !important}
  .catedit{grid-template-columns:auto 1fr 88px auto;gap:6px}
  .catedit input[type=text],.catedit input[type=number],.catedit select{padding:8px 8px}
}
@media(max-width:560px){
  .tabs-inner{padding:5px}
  .tab{flex:1 1 0;min-width:0;padding:8px 2px;font-size:10px;gap:3px;flex-direction:column;letter-spacing:-.01em}
  .tab svg{width:17px;height:17px}
  .tab .lg{display:none}
  .tab .sm2{display:inline}
  .hero .amount{font-size:clamp(34px,9.5vw,50px)}
  .card{padding:15px}
  .tblwrap{margin:0 -15px;padding:0 15px}
}
main{padding-top:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;scroll-margin-top:78px}
.card h2{margin:0 0 2px;font-size:15px;font-weight:650;letter-spacing:-.01em}
.card .sub{margin:0 0 14px;font-size:12.5px;color:var(--text-3)}
.grid{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:620px){.tiles{grid-template-columns:1fr;gap:8px}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.tile .t{font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);display:flex;align-items:center;gap:6px}
.tile .v{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.tile .h{font-size:12px;color:var(--text-3);margin-top:2px}
.tile-btn{text-align:left;width:100%;cursor:pointer;transition:border-color .15s, transform .15s, box-shadow .15s}
.tile-btn:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.tile-btn:active{transform:translateY(0)}
.tchev{margin-left:auto;opacity:.45;flex:none}
.dot{width:8px;height:8px;border-radius:3px;display:inline-block;flex:none}

/* ---------- budget rows ---------- */
.brow{padding:12px 0;border-bottom:1px solid var(--border)}
.brow-btn{display:block;width:calc(100% + 16px);margin-left:-8px;text-align:left;cursor:pointer;
  padding-left:8px;padding-right:8px;border-radius:10px;transition:background .15s}
.brow-btn:hover{background:var(--surface-2)}
.brow-chev{margin-left:auto;opacity:.4;flex:none}
.brow:last-child{border-bottom:none;padding-bottom:0}
.brow:first-child{padding-top:0}
.brow-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.brow-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.brow-name .em{font-size:15px;line-height:1;flex:none}
.brow-val{font-size:13px;color:var(--text-2);white-space:nowrap}
.brow-val b{color:var(--text);font-weight:650}
.track{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden;display:flex;gap:2px}
.fill{height:100%;border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1);min-width:0}
.brow-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;margin-top:6px;font-size:12px;color:var(--text-3)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:650}
.pill.ok{background:var(--brand-soft);color:var(--brand-ink)}
.pill.warn{background:#fff4dd;color:#8a5a00}
.pill.crit{background:#fdeaea;color:#a12626}
:root[data-theme="dark"] .pill.warn{background:#3a2e12;color:#f5c86a}
:root[data-theme="dark"] .pill.crit{background:#3a1e1e;color:#f09a9a}
.group-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.group-label:first-child{margin-top:0}
.group-label span.amt{margin-left:auto;color:var(--text-2);letter-spacing:0;text-transform:none;font-size:12.5px}

/* ---------- forms ---------- */
label.f{display:block;font-size:12px;font-weight:650;color:var(--text-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);
  background:var(--surface);outline:none;transition:.15s;font-size:15px
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:var(--r-sm);font-weight:650;font-size:14px;background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong);transition:.15s}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger{color:var(--crit);border-color:var(--border-strong)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:8px 13px;border-radius:99px;border:1.5px solid var(--border-strong);font-size:13.5px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;transition:.15s;background:var(--surface)}
.chip:hover{border-color:var(--brand);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.amount-input{position:relative}
.amount-input input{font-size:34px;font-weight:700;padding:14px 46px 14px 16px;letter-spacing:-.02em;text-align:right}
.amount-input .cur{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:600;color:var(--text-3);pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2.one{grid-template-columns:1fr}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- tx list ---------- */
.daygroup{margin-top:16px}
.daygroup:first-child{margin-top:0}
.dayhead{display:flex;justify-content:space-between;font-size:12px;font-weight:650;color:var(--text-3);text-transform:capitalize;padding-bottom:6px;border-bottom:1px solid var(--border)}
.tx{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.tx:last-child{border-bottom:none}
.tx .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none;background:var(--surface-3)}
.tx .m{flex:1;min-width:0}
.tx .m .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m .c{font-size:12px;color:var(--text-3)}
.tx .a{font-weight:650;font-size:15px;white-space:nowrap}
.tx .del{opacity:0;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);flex:none;transition:.15s}
.tx:hover .del,.tx:focus-within .del{opacity:1}
.tx .del:hover{background:var(--surface-3);color:var(--crit)}
@media(hover:none){.tx .del{opacity:.5}}
.owe{display:inline-flex;align-items:center;gap:4px;background:#fdeaea;color:#a12626;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.owe::before{content:'';width:5px;height:5px;border-radius:99px;background:currentColor;flex:none}
:root[data-theme="dark"] .owe{background:#3a1e1e;color:#f09a9a}
.banner.owe-b{background:#fdeaea;color:#a12626;cursor:pointer}
:root[data-theme="dark"] .banner.owe-b{background:#3a1e1e;color:#f09a9a}
.person{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.person:first-of-type{margin-top:0}
.person .pn{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:8px}
.person .pav{width:30px;height:30px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.person .pt{font-weight:700;font-size:14.5px;color:var(--crit)}
.dline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.dline:last-child{border-bottom:none}
.dline .m{flex:1;min-width:0}
.dline .m .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dline .m .c{font-size:11.5px;color:var(--text-3)}
.dline .a{font-weight:650;font-size:14px;white-space:nowrap}
.dline.done .m .n,.dline.done .a{color:var(--text-3);text-decoration:line-through}
@media(max-width:560px){
  .dline{flex-wrap:wrap;row-gap:9px;padding:11px 0}
  .dline .m{flex:1 1 100%}
  .dline .a{flex:1 1 auto}
}
.empty{text-align:center;padding:34px 16px;color:var(--text-3);font-size:13.5px}
.tx.hl{background:var(--brand-soft);border-radius:12px;box-shadow:0 0 0 8px var(--brand-soft);animation:flash 2.6s ease-out forwards}
@keyframes flash{0%,55%{background:var(--brand-soft);box-shadow:0 0 0 8px var(--brand-soft)}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
.sres{display:flex;align-items:center;gap:11px;padding:10px 8px;width:calc(100% + 16px);margin-left:-8px;border-radius:11px;text-align:left;cursor:pointer;transition:background .15s}
.sres:hover{background:var(--surface-2)}
.sres .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none;background:var(--surface-3)}
.sres .m{flex:1;min-width:0}
.sres .m .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres .m .c{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres .a{font-weight:650;font-size:14.5px;white-space:nowrap;text-align:right;flex:none}
.sres .a .mo{display:block;font-size:11.5px;font-weight:600;color:var(--text-3);text-transform:capitalize;margin-top:2px}
.sres mark{background:#fff2a8;color:inherit;border-radius:3px;padding:0 1px}
:root[data-theme="dark"] .sres mark{background:#5a4a12;color:#ffe89a}
#dlgSearch{max-width:520px}
#qRes{max-height:min(52vh,440px);overflow-y:auto;margin:0 -8px}
.qbar{position:relative}
.qbar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.qbar input{padding-left:40px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.5}

/* ---------- table ---------- */
.tblwrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
table.data th{text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:650;padding:0 10px 8px;border-bottom:1px solid var(--border)}
table.data th:first-child,table.data td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
table.data td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--border)}
table.data tr:last-child td{border-bottom:none}
table.data tr.cur td{background:var(--brand-soft)}
table.data tr.cur td:first-child{background:var(--brand-soft)}
.pos{color:var(--brand)}.neg{color:var(--crit)}
:root[data-theme="dark"] .pos{color:var(--brand)}

/* ---------- chart ---------- */
.chartbox{position:relative}
svg.chart{display:block;width:100%;overflow:visible}
svg.chart text{font-size:10.5px;fill:var(--text-3);font-family:inherit}
svg.chart .axlabel{font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-lg);padding:9px 11px;font-size:12.5px;opacity:0;transition:opacity .12s;z-index:20;white-space:nowrap}
.tip .th{font-weight:650;margin-bottom:4px;text-transform:capitalize}
.tip .tr{display:flex;justify-content:space-between;gap:14px}
.tip .tr span:last-child{font-weight:650}

/* ---------- misc ---------- */
.banner{display:flex;gap:11px;align-items:flex-start;background:var(--brand-soft);border:1px solid transparent;border-radius:var(--r);padding:13px 15px;margin-bottom:14px;font-size:13.5px;color:var(--brand-ink)}
.banner.warn{background:#fff6e6;color:#7a5100}
:root[data-theme="dark"] .banner.warn{background:#332812;color:#f0c579}
.banner .bx{margin-left:auto;flex:none;opacity:.6}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.fab[hidden]{display:none}
.fab{position:fixed;right:max(16px,calc(50vw - 544px));bottom:calc(22px + env(safe-area-inset-bottom, 0px));z-index:50;width:58px;height:58px;padding:0;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 8px 28px -6px rgba(27,127,79,.55);transition:transform .15s, background .15s}
.fab:active{transform:scale(.94)}
.fab:hover{background:var(--brand-2)}
dialog{border:none;padding:0;border-radius:18px;background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg);max-width:440px;width:calc(100% - 28px)}
dialog::backdrop{background:rgba(10,20,14,.5);backdrop-filter:blur(3px)}
.dlg{padding:20px}
.dlg h3{margin:0 0 16px;font-size:17px;font-weight:650}
.dlg-actions{display:flex;gap:9px;margin-top:18px}
.dlg-actions .btn{flex:1}
.hint{font-size:12px;color:var(--text-3);margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(26px + env(safe-area-inset-bottom, 0px));background:var(--text);color:var(--surface);padding:11px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:99;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.catedit{display:grid;grid-template-columns:auto 1fr 96px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.ce{grid-template-columns:46px minmax(0,1fr) 152px 92px auto;align-items:center;grid-template-areas:"em nm gr bd ac";column-gap:8px}
.ce-em{grid-area:em;width:46px;text-align:center;padding-left:2px;padding-right:2px}
.ce-nm{grid-area:nm;min-width:0;width:100%}
.ce-gr{grid-area:gr;min-width:0;width:100%}
.ce-bd{grid-area:bd;min-width:0;width:100%;text-align:right}
.ce-ac{grid-area:ac;display:flex;gap:4px;align-items:center;justify-content:flex-end}
@media(max-width:700px){
  .ce{grid-template-columns:36px minmax(0,1fr) 88px 52px auto;column-gap:4px}
  .ce-em{width:36px;padding-left:0;padding-right:0}
  .ce-nm,.ce-gr,.ce-bd{padding-left:6px;padding-right:4px}
  .ce-ac{gap:0}
  .ce-ac .del{width:26px}
  .ce-hd{font-size:9.5px}
  .card:has(.ce){padding-left:12px;padding-right:12px}
}
.catedit:last-of-type{border-bottom:none}
.catedit input[type=text]{padding:7px 10px;font-size:14px}
.catedit input[type=number]{padding:7px 10px;font-size:14px;text-align:right}
.small{font-size:12.5px;color:var(--text-3)}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:none}
.kv b{font-weight:650}
</style>

<script>
/* ===================== DONNÉES INITIALES (import Excel) ===================== */
const SEED={"solde0":0,"m":[]};

const CAT_DEF = [
  {id:'Courses',   em:'🛒', grp:'i', budget:84},
  {id:'Factures',  em:'🧾', grp:'i', budget:38},
  {id:'Santé',     em:'💊', grp:'i', budget:30},
  {id:'Voiture',   em:'🚗', grp:'i', budget:80},
  {id:'Nori',      em:'🐾', grp:'i', budget:25},
  {id:'Sorties',   em:'🍸', grp:'l', budget:50},
  {id:'Shopping',  em:'🛍️', grp:'l', budget:50},
  {id:'Cadeaux',   em:'🎁', grp:'l', budget:0},
  {id:'Voyage',    em:'✈️', grp:'l', budget:0},
  {id:'Divers',    em:'✨', grp:'l', budget:0},
];
const GRP_NAME = {i:'Indispensables', l:'Loisirs'};
const KEY = 'finances_v2';

/* ===================== ÉTAT ===================== */
let S = null;
let uid = () => Math.random().toString(36).slice(2,10);

function buildFromSeed(){
  const st = {v:2, solde0:SEED.solde0, cats:CAT_DEF.map(c=>({...c, report:true})), months:{}, tx:[], debts:[]};
  SEED.m.forEach(m=>{
    st.months[m.k] = {
      rev: m.rev.map(r=>({id:uid(), l:r.l, a:r.a})),
      adj: m.adj || 0,
      b: Object.assign({}, m.b)
    };
    m.tx.forEach(t=>{
      st.tx.push({id:uid(), d:m.k+'-01', c:t[0], a:t[1], n:t[2]||'', imp:1});
    });
  });
  return st;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); if(p && p.v===2 && p.cats && p.tx) return p; }
  }catch(e){}
  return buildFromSeed();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Sauvegarde impossible — pense à exporter tes données'); }
}

/* ===================== OUTILS ===================== */
const nfEur = new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR',minimumFractionDigits:2});
const nfEur0 = new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const nfNum = new Intl.NumberFormat('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt = n => nfEur.format(n||0);
const fmt0 = n => nfEur0.format(n||0);
const sgn = n => (n>0?'+':'') + nfEur.format(n||0);
const r2 = n => Math.round((n+Number.EPSILON)*100)/100;
/* accepte « 12,50 », « 12.50 », « 1 200,50 », « 12,50 € » */
function numFR(v){
  if(v==null) return NaN;
  const s=String(v).replace(/[\s\u00a0€]/g,'').replace(',','.');
  if(s==='' || !/^-?\d*\.?\d*$/.test(s)) return NaN;
  return parseFloat(s);
}

function mKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function mLabel(k, long){
  const [y,m]=k.split('-').map(Number);
  return new Intl.DateTimeFormat('fr-BE',{month: long?'long':'short', year:'numeric'}).format(new Date(y,m-1,1));
}
function mShort(k){ const [y,m]=k.split('-').map(Number);
  return new Intl.DateTimeFormat('fr-BE',{month:'short'}).format(new Date(y,m-1,1)).replace('.',''); }
function dLabel(iso){
  const d = new Date(iso+'T12:00:00');
  return new Intl.DateTimeFormat('fr-BE',{weekday:'long',day:'numeric',month:'long'}).format(d);
}
function deMois(k){ const s=mLabel(k,true); return (/^[aeiouyâêîôûéè]/i.test(s)?"d'":'de ')+s; }
function addM(k,n){ const [y,m]=k.split('-').map(Number); const d=new Date(y,m-1+n,1); return mKey(d); }
function cmpM(a,b){ return a<b?-1:a>b?1:0; }
function daysIn(k){ const [y,m]=k.split('-').map(Number); return new Date(y,m,0).getDate(); }
function cat(id){ return S.cats.find(c=>c.id===id) || {id, em:'•', grp:'l', budget:0, report:true}; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function el(id){ return document.getElementById(id); }
let toastT;
function toast(msg){ const t=el('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2400); }

/* ===================== CALCULS ===================== */
let CACHE = {};
function bust(){ CACHE = {}; }

function allMonths(){
  if(CACHE.am) return CACHE.am;
  const set = new Set(Object.keys(S.months));
  S.tx.forEach(t=>set.add(t.d.slice(0,7)));
  set.add(mKey(new Date()));
  const arr=[...set].sort(cmpM);
  // combler les trous pour que la courbe reste continue
  const out=[]; let k=arr[0];
  while(cmpM(k,arr[arr.length-1])<=0){ out.push(k); k=addM(k,1); }
  CACHE.am = out; return out;
}
function txOf(k){
  if(!CACHE.tx) CACHE.tx={};
  if(!CACHE.tx[k]) CACHE.tx[k] = S.tx.filter(t=>t.d.slice(0,7)===k);
  return CACHE.tx[k];
}
function agg(k){
  if(!CACHE.ag) CACHE.ag={};
  if(CACHE.ag[k]) return CACHE.ag[k];
  const M = S.months[k] || {rev:[],adj:0,b:{}};
  const byCat={}, byGrp={i:0,l:0};
  let dep=0;
  txOf(k).forEach(t=>{ byCat[t.c]=(byCat[t.c]||0)+t.a; dep+=t.a; byGrp[cat(t.c).grp]+=t.a; });
  const rev = (M.rev||[]).reduce((s,r)=>s+r.a,0);
  const a = {rev:r2(rev), dep:r2(dep), byCat, byGrp, adj:M.adj||0, epargne:r2(rev-dep)};
  CACHE.ag[k]=a; return a;
}
function soldes(){
  if(CACHE.so) return CACHE.so;
  const out={}; let cur=S.solde0;
  allMonths().forEach(k=>{ const a=agg(k); out[k]={debut:r2(cur), fin:r2(cur+a.rev-a.dep+a.adj)}; cur=out[k].fin; });
  CACHE.so=out; return out;
}
function budgetOf(k, id){
  const M=S.months[k];
  if(M && M.b && M.b[id]!=null) return M.b[id];
  return cat(id).budget||0;
}
/* report du reste, cumulé de mois en mois */
function restes(){
  if(CACHE.re) return CACHE.re;
  const mode = S.reportMode || 'pos';
  const out={}; const carry={};
  allMonths().forEach(k=>{
    if(S.reportFrom && k===S.reportFrom) Object.keys(carry).forEach(id=>carry[id]=0);
    const a=agg(k); out[k]={};
    S.cats.forEach(c=>{
      const b=budgetOf(k,c.id);
      const prev = (mode!=='none' && c.report) ? (carry[c.id]||0) : 0;
      const dispo = r2(b + prev);
      const dep = r2(a.byCat[c.id]||0);
      const reste = r2(dispo - dep);
      out[k][c.id]={budget:b, report:prev, dispo, dep, reste};
      let nc = reste;
      if(mode==='pos') nc = Math.max(0, reste);
      if(mode==='none') nc = 0;
      carry[c.id] = (b>0||prev!==0) ? nc : 0;
    });
  });
  CACHE.re=out; return out;
}
function monthProgress(k){
  const today=new Date(), tk=mKey(today);
  if(cmpM(k,tk)<0) return 1;
  if(cmpM(k,tk)>0) return 0;
  return today.getDate()/daysIn(k);
}
function statusOf(dep, dispo, prog){
  if(dispo<=0) return dep>0?'crit':'ok';
  const p=dep/dispo;
  if(p>1) return 'crit';
  if(p > Math.max(prog,0.15)+0.28 || p>0.9) return 'warn';
  return 'ok';
}

/* ===================== GRAPHIQUES (SVG maison) ===================== */
function niceMax(v){
  if(v<=0) return 10;
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  const n=v/p;
  const s = n<=1?1 : n<=1.5?1.5 : n<=2?2 : n<=2.5?2.5 : n<=3?3 : n<=4?4 : n<=5?5 : n<=7.5?7.5 : 10;
  return s*p;
}
function cw(host,min){ const w=host.clientWidth||760; return Math.max(min||300, Math.min(780, Math.round(w))); }
function svgEl(t,at){ const e=document.createElementNS('http://www.w3.org/2000/svg',t); for(const k in at) e.setAttribute(k,at[k]); return e; }

/* Aire : évolution du solde */
function areaChart(host, pts){
  host.innerHTML='';
  if(pts.length<2){ host.innerHTML='<div class="empty">Pas encore assez de mois pour tracer une courbe.</div>'; return; }
  const W=cw(host),H=W<460?176:210,PL=W<460?44:54,PR=12,PT=14,PB=26;
  const vals=pts.map(p=>p.v);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const pad=(hi-lo)*0.15 || Math.max(hi*0.1,10);
  lo=Math.max(0,lo-pad); hi=hi+pad;
  const X=i=> PL + i*(W-PL-PR)/(pts.length-1);
  const Y=v=> PT + (1-(v-lo)/(hi-lo||1))*(H-PT-PB);
  const svg=svgEl('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.setAttribute('aria-label','Évolution du solde');
  const defs=svgEl('defs'); const g=svgEl('linearGradient',{id:'gArea',x1:'0',y1:'0',x2:'0',y2:'1'});
  g.appendChild(svgEl('stop',{offset:'0%','stop-color':'var(--s1)','stop-opacity':'.34'}));
  g.appendChild(svgEl('stop',{offset:'100%','stop-color':'var(--s1)','stop-opacity':'0'}));
  defs.appendChild(g); svg.appendChild(defs);
  for(let i=0;i<=4;i++){
    const v=lo+(hi-lo)*i/4, y=Y(v);
    svg.appendChild(svgEl('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t=svgEl('text',{x:PL-6,y:y+3.5,'text-anchor':'end'}); t.textContent=nfEur0.format(v); svg.appendChild(t);
  }
  const dLine=pts.map((p,i)=>(i?'L':'M')+X(i)+' '+Y(p.v)).join(' ');
  const dArea=dLine+` L${X(pts.length-1)} ${H-PB} L${X(0)} ${H-PB} Z`;
  svg.appendChild(svgEl('path',{d:dArea,fill:'url(#gArea)'}));
  svg.appendChild(svgEl('path',{d:dLine,fill:'none',stroke:'var(--s1)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
  const step=Math.ceil(pts.length/(W<460?4:7));
  pts.forEach((p,i)=>{
    if(i%step===0||i===pts.length-1){
      const t=svgEl('text',{x:X(i),y:H-8,'text-anchor':'middle',class:'axlabel'}); t.textContent=mShort(p.k); svg.appendChild(t);
    }
  });
  const last=pts.length-1;
  svg.appendChild(svgEl('circle',{cx:X(last),cy:Y(pts[last].v),r:4.5,fill:'var(--s1)',stroke:'var(--surface)','stroke-width':2}));
  const cross=svgEl('line',{x1:0,x2:0,y1:PT,y2:H-PB,stroke:'var(--border-strong)','stroke-width':1,opacity:0});
  const mark=svgEl('circle',{r:5,fill:'var(--s1)',stroke:'var(--surface)','stroke-width':2,opacity:0});
  svg.appendChild(cross); svg.appendChild(mark);
  host.appendChild(svg);
  const tip=document.createElement('div'); tip.className='tip'; host.appendChild(tip);
  const hit=svgEl('rect',{x:0,y:0,width:W,height:H,fill:'transparent'}); svg.appendChild(hit);
  function move(ev){
    const r=svg.getBoundingClientRect();
    const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
    const i=Math.max(0,Math.min(pts.length-1,Math.round((cx/r.width*W-PL)/((W-PL-PR)/(pts.length-1)))));
    const p=pts[i];
    cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i)); cross.setAttribute('opacity',.8);
    mark.setAttribute('cx',X(i)); mark.setAttribute('cy',Y(p.v)); mark.setAttribute('opacity',1);
    tip.innerHTML=`<div class="th">${mLabel(p.k,true)}</div><div class="tr"><span>Solde</span><span>${fmt(p.v)}</span></div>`+
      (p.ep!=null?`<div class="tr"><span>Épargne</span><span>${sgn(p.ep)}</span></div>`:'');
    tip.style.opacity=1;
    const px=X(i)/W*r.width;
    tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+'px';
    tip.style.top=Math.max(0,Y(p.v)/H*r.height-tip.offsetHeight-12)+'px';
  }
  function out(){ tip.style.opacity=0; cross.setAttribute('opacity',0); mark.setAttribute('opacity',0); }
  svg.addEventListener('mousemove',move); svg.addEventListener('mouseleave',out);
  svg.addEventListener('touchstart',move,{passive:true}); svg.addEventListener('touchmove',move,{passive:true}); svg.addEventListener('touchend',out);
}

/* Barres +/- : épargne mensuelle */
function barsChart(host, pts){
  host.innerHTML='';
  if(!pts.length){ host.innerHTML='<div class="empty">Aucune donnée.</div>'; return; }
  const W=cw(host),H=W<460?170:200,PL=W<460?44:54,PR=12,PT=12,PB=26;
  const maxV=Math.max(...pts.map(p=>Math.abs(p.v)),1);
  const M=niceMax(Math.max(maxV,20));
  const hasNeg=pts.some(p=>p.v<0);
  const lo=hasNeg?-M:0, hi=M;
  const Y=v=> PT+(1-(v-lo)/(hi-lo))*(H-PT-PB);
  const bw=Math.min(38,(W-PL-PR)/pts.length-6);
  const X=i=> PL+(i+0.5)*(W-PL-PR)/pts.length;
  const svg=svgEl('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.setAttribute('aria-label','Épargne par mois');
  const ticks=hasNeg?[lo,lo/2,0,hi/2,hi]:[0,hi/4,hi/2,hi*3/4,hi];
  ticks.forEach(v=>{
    const y=Y(v);
    svg.appendChild(svgEl('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:v===0?'var(--border-strong)':'var(--grid)','stroke-width':1}));
    const t=svgEl('text',{x:PL-6,y:y+3.5,'text-anchor':'end'}); t.textContent=nfEur0.format(v); svg.appendChild(t);
  });
  const tip=document.createElement('div'); tip.className='tip';
  pts.forEach((p,i)=>{
    const y0=Y(0), y1=Y(p.v);
    const top=Math.min(y0,y1), h=Math.max(2,Math.abs(y1-y0));
    const rect=svgEl('rect',{x:X(i)-bw/2,y:top,width:bw,height:h,rx:4,
      fill:p.v<0?'var(--crit)':'var(--s1)'});
    rect.style.cursor='default';
    rect.addEventListener('mouseenter',()=>{
      const r=svg.getBoundingClientRect();
      tip.innerHTML=`<div class="th">${mLabel(p.k,true)}</div><div class="tr"><span>Épargne</span><span>${sgn(p.v)}</span></div>`+
        `<div class="tr"><span>Revenus</span><span>${fmt(p.rev)}</span></div><div class="tr"><span>Dépenses</span><span>${fmt(p.dep)}</span></div>`;
      tip.style.opacity=1;
      const px=X(i)/W*r.width;
      tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+'px';
      tip.style.top=Math.max(0,top/H*r.height-tip.offsetHeight-10)+'px';
    });
    rect.addEventListener('mouseleave',()=>tip.style.opacity=0);
    svg.appendChild(rect);
  });
  const step=Math.ceil(pts.length/(W<460?4:8));
  pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1){
    const t=svgEl('text',{x:X(i),y:H-8,'text-anchor':'middle',class:'axlabel'}); t.textContent=mShort(p.k); svg.appendChild(t);} });
  host.appendChild(svg); host.appendChild(tip);
}

/* Barres groupées : revenus vs dépenses */
function groupedChart(host, pts){
  host.innerHTML='';
  if(!pts.length){ host.innerHTML='<div class="empty">Aucune donnée.</div>'; return; }
  const W=cw(host),H=W<460?176:210,PL=W<460?44:54,PR=12,PT=12,PB=26;
  const M=niceMax(Math.max(...pts.flatMap(p=>[p.rev,p.dep]),20));
  const Y=v=> PT+(1-v/M)*(H-PT-PB);
  const slot=(W-PL-PR)/pts.length;
  const bw=Math.min(16,slot/2-3);
  const X=i=> PL+(i+0.5)*slot;
  const svg=svgEl('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.setAttribute('aria-label','Revenus et dépenses par mois');
  for(let i=0;i<=4;i++){ const v=M*i/4,y=Y(v);
    svg.appendChild(svgEl('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t=svgEl('text',{x:PL-6,y:y+3.5,'text-anchor':'end'}); t.textContent=nfEur0.format(v); svg.appendChild(t);}
  const tip=document.createElement('div'); tip.className='tip';
  pts.forEach((p,i)=>{
    [['rev','var(--s1)',-1],['dep','var(--s2)',1]].forEach(([k,col,side])=>{
      const v=p[k], y=Y(v), h=Math.max(2,(H-PB)-y);
      const x=X(i)+side*(bw/2+1)-bw/2;
      const rect=svgEl('rect',{x,y,width:bw,height:h,rx:3.5,fill:col});
      rect.addEventListener('mouseenter',()=>{
        const r=svg.getBoundingClientRect();
        tip.innerHTML=`<div class="th">${mLabel(p.k,true)}</div><div class="tr"><span>Revenus</span><span>${fmt(p.rev)}</span></div><div class="tr"><span>Dépenses</span><span>${fmt(p.dep)}</span></div><div class="tr"><span>Épargne</span><span>${sgn(p.rev-p.dep)}</span></div>`;
        tip.style.opacity=1;
        const px=X(i)/W*r.width;
        tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+'px';
        tip.style.top=Math.max(0,Math.min(y,Y(p.rev))/H*r.height-tip.offsetHeight-10)+'px';
      });
      rect.addEventListener('mouseleave',()=>tip.style.opacity=0);
      svg.appendChild(rect);
    });
  });
  const step=Math.ceil(pts.length/(W<460?4:8));
  pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1){
    const t=svgEl('text',{x:X(i),y:H-8,'text-anchor':'middle',class:'axlabel'}); t.textContent=mShort(p.k); svg.appendChild(t);} });
  host.appendChild(svg); host.appendChild(tip);
}

/* ---------- Dépenses ---------- */
function renderTx(){
  const a=agg(CUR);
  const list=txOf(CUR).slice().sort((x,y)=> x.d===y.d ? 0 : (x.d<y.d?1:-1));
  const shown=FILTER? list.filter(t=>t.c===FILTER) : list;
  let html='';

  html+=`<div class="card" id="cardRev">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div><h2>Revenus ${deMois(CUR)}</h2><p class="sub" style="margin-bottom:0">Total ${fmt(a.rev)}</p></div>
      <button class="btn sm primary" data-act="addrev">+ Revenu</button>
    </div>`;
  const revs=(S.months[CUR]?.rev)||[];
  if(revs.length){
    revs.forEach(r=>{
      html+=`<div class="tx${HILITE===r.id?' hl':''}" id="r-${r.id}"><div class="ico">💶</div><div class="m"><div class="n">${esc(r.l)}</div>${r.n?`<div class="c">${esc(r.n)}</div>`:''}</div><div class="a tnum" style="color:var(--brand)">${sgn(r.a)}</div>

    });
  } else html+='<div class="empty">Aucun revenu enregistré ce mois-ci.</div>';
  if((S.months[CUR]?.adj)) html+=`<div class="brow-foot" style="margin-top:10px"><span>Ajustement de solde</span><span class="tnum">${sgn(S.months[CUR].adj)}</span></div>`;
  html+='</div>';

  html+=`<div class="card" id="cardDep">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div><h2>Dépenses ${deMois(CUR)}</h2><p class="sub" style="margin-bottom:0">${list.length} opération(s) · ${fmt(a.dep)}</p></div>
      <button class="btn sm primary" data-act="addtx">+ Dépense</button>
    </div>
    <div class="chips" style="margin-bottom:6px">
      <button class="chip" data-filter="" aria-pressed="${!FILTER}">Tout</button>`;
  S.cats.forEach(c=>{
    const v=a.byCat[c.id]||0;
    if(!v && FILTER!==c.id) return;
    html+=`<button class="chip" data-filter="${esc(c.id)}" aria-pressed="${FILTER===c.id}">${c.em} ${esc(c.id)} · ${nfNum.format(v)} €</button>`;
  });
  html+='</div>';

  if(!shown.length){
    html+='<div class="empty"><span class="big">🌿</span>Aucune dépense ici. Appuie sur « Dépense » pour en ajouter une.</div>';
  } else {
    let day=null;
    shown.forEach(t=>{
      if(t.d!==day){
        if(day!==null) html+='</div>';
        day=t.d;
        const dayTot=shown.filter(x=>x.d===day).reduce((s,x)=>s+x.a,0);
        html+=`<div class="daygroup"><div class="dayhead"><span>${t.imp?'Import Excel · '+mLabel(CUR,true):dLabel(t.d)}</span><span class="tnum">${fmt(dayTot)}</span></div>`;
      }
      const c=cat(t.c);
      html+=`<div class="tx${HILITE===t.id?' hl':''}" id="r-${t.id}">
        <div class="ico">${c.em}</div>
        <div class="m"><div class="n">${esc(t.n||t.c)}</div><div class="c" style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">${t.n?esc(t.c):(t.imp?"importé de l'Excel":'')}${oweOf(t.id)?`<span class="owe">${nfNum.format(oweOf(t.id))} € dû</span>`:''}</div></div>

}

/* ---------- Règlement de comptes ---------- */
function renderDebt(){
  const all=debts();
  const open=all.filter(d=>!d.paid).sort((x,y)=>x.d<y.d?1:-1);
  const done=all.filter(d=>d.paid).sort((x,y)=>(x.pd||'')<(y.pd||'')?1:-1);
  const tot=oweTotal();
  let html='';

  html+=`<div class="tiles" style="grid-template-columns:1fr">
    <div class="tile"><div class="t"><span class="dot" style="background:${tot>0?'var(--crit)':'var(--brand)'}"></span>On te doit au total</div>
    <div class="v tnum" style="color:${tot>0?'var(--crit)':'var(--brand)'}">${fmt(tot)}</div>
    <div class="h">${open.length} ligne(s) en attente · ${new Set(open.map(d=>d.who)).size} personne(s)</div></div>

    Object.keys(byWho).sort((a,b)=>a.localeCompare(b,'fr')).forEach(w=>{

      html+=`<div class="person"><div class="pn"><span class="pav">${esc(initials(w))}</span>${esc(w)}</div><div class="pt tnum">${fmt(st)}</div></div>`;

          <div class="m"><div class="n">${esc(d.n || (t? (t.n||t.c) : 'Prêt'))}</div>
            <div class="c">${dLabel(d.d)}${t?' · dépense de '+fmt(t.a)+' en '+esc(t.c):''}</div></div>
          <div class="a tnum">${fmt(d.a)}</div>
          <button class="btn sm" data-pay="${d.id}">Remboursé</button>
          <button class="del" data-deldebt="${d.id}" aria-label="Supprimer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
        </div>`;
      });
    });
  }
  html+='</div>';

  if(done.length){
    html+=`<div class="card"><h2>Réglé</h2><p class="sub">Chaque remboursement a été ajouté à tes revenus du mois.</p>`;
    done.slice(0,60).forEach(d=>{

        <div class="m"><div class="n">${esc(d.who)} — ${esc(d.n||'Prêt')}</div><div class="c">remboursé le ${dLabel(d.pd||d.d)}</div></div>
        <div class="a tnum">${fmt(d.a)}</div>
        <button class="btn sm" data-unpay="${d.id}">Annuler</button>

  el('p-debt').innerHTML=html;
}

function catChart(host, ms){
  host.innerHTML='';
  const R=restes();
  const pts=ms.map(k=>({k, v:r2(agg(k).byCat[HCAT]||0), b:R[k][HCAT]?R[k][HCAT].budget:0}));
  if(!pts.length){ host.innerHTML='<div class="empty">Aucune donnée.</div>'; return; }
  const W=cw(host),H=W<460?170:200,PL=W<460?44:54,PR=12,PT=12,PB=26;
  const M=niceMax(Math.max(...pts.flatMap(p=>[p.v,p.b]),20));
  const Y=v=>PT+(1-v/M)*(H-PT-PB);
  const slot=(W-PL-PR)/pts.length, bw=Math.max(4,Math.min(34,slot-8)), X=i=>PL+(i+0.5)*slot;
  const svg=svgEl('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.setAttribute('aria-label','Dépenses mensuelles de la catégorie '+HCAT);
  for(let i=0;i<=4;i++){const v=M*i/4,y=Y(v);
    svg.appendChild(svgEl('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t=svgEl('text',{x:PL-6,y:y+3.5,'text-anchor':'end'});t.textContent=nfEur0.format(v);svg.appendChild(t);}
  const tip=document.createElement('div');tip.className='tip';
  pts.forEach((p,i)=>{
    const y=Y(p.v),h=Math.max(2,(H-PB)-y);
    const over=p.b>0&&p.v>p.b;
    const rect=svgEl('rect',{x:X(i)-bw/2,y,width:bw,height:h,rx:4,fill:over?'var(--crit)':'var(--s1)'});
    rect.addEventListener('mouseenter',()=>{
      const r=svg.getBoundingClientRect();
      tip.innerHTML=`<div class="th">${mLabel(p.k,true)}</div><div class="tr"><span>${esc(HCAT)}</span><span>${fmt(p.v)}</span></div>`+(p.b?`<div class="tr"><span>Budget</span><span>${fmt(p.b)}</span></div>`:'');
      tip.style.opacity=1;
      const px=X(i)/W*r.width;
      tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+'px';
      tip.style.top=Math.max(0,y/H*r.height-tip.offsetHeight-10)+'px';
    });
    rect.addEventListener('mouseleave',()=>tip.style.opacity=0);
    svg.appendChild(rect);
    if(p.b>0){
      svg.appendChild(svgEl('line',{x1:X(i)-bw/2-2,x2:X(i)+bw/2+2,y1:Y(p.b),y2:Y(p.b),stroke:'var(--text-3)','stroke-width':2,'stroke-linecap':'round','stroke-dasharray':'3 3'}));
    }
  });
  const step=Math.ceil(pts.length/(W<460?4:8));
  pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1){
    const t=svgEl('text',{x:X(i),y:H-8,'text-anchor':'middle',class:'axlabel'});t.textContent=mShort(p.k);svg.appendChild(t);}});
  host.appendChild(svg); host.appendChild(tip);
  const lg=document.createElement('div'); lg.className='legend';
  lg.innerHTML=`<span><i style="background:var(--s1)"></i>Dépensé</span><span><i style="background:var(--crit)"></i>Budget dépassé</span><span><i style="background:var(--text-3);height:2px;border-radius:2px"></i>Budget du mois</span>`;
  host.appendChild(lg);
}

/* ===================== RENDU GLOBAL ===================== */
function render(){
  bust();
  const ms=allMonths();
  if(!CUR || ms.indexOf(CUR)<0) CUR=defaultMonth();
  renderHero();
  ['dash','tx','debt','hist','set'].forEach(t=>{ el('p-'+t).hidden = (t!==TAB); });
  el('fab').hidden = (TAB==='set');
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===TAB));
  if(TAB==='dash') renderDash();
  else if(TAB==='tx') renderTx();
  else if(TAB==='debt') renderDebt();
  else if(TAB==='hist') renderHist();
  else renderSet();
}

/* ===================== ÉVÉNEMENTS ===================== */
const REV_PRESETS=['Salaire','Chèques repas','Prime','Remboursement','Autre'];
let KIND='dep';
function setKind(k){
  KIND=k;
  document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.kind===k)));
  el('wrapCats').hidden = k!=='dep';
  el('wrapRev').hidden  = k!=='rev';
  el('wrapNote').hidden = false;
  el('wrapDebt').hidden = k!=='dep';
  el('txTitle').textContent = k==='dep' ? 'Nouvelle dépense' : 'Nouveau revenu';
}
let SHARE='half';
function syncDebtAmt(){
  if(!el('debtOn').checked || SHARE==='custom') return;
  const a=numFR(el('txAmount').value);
  if(!isFinite(a)) { el('debtAmt').value=''; return; }
  el('debtAmt').value = (SHARE==='all'? r2(a) : r2(a/2)).toFixed(2);
}
function setShare(s){
  SHARE=s;
  document.querySelectorAll('[data-share]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.share===s)));
  if(s==='custom'){ el('debtAmt').focus(); el('debtAmt').select(); } else syncDebtAmt();
}
function toggleDebt(){
  const on=el('debtOn').checked;
  el('debtFields').hidden=!on;
  if(on){ setShare('half'); setTimeout(()=>el('debtWho').focus(),40); }
}
function openTx(kind){
  el('txAmount').value=''; el('txNote').value=''; el('revLbl2').value='';
  el('debtOn').checked=false; el('debtFields').hidden=true; el('debtWho').value=''; el('debtAmt').value=''; SHARE='half';
  document.querySelectorAll('[data-share]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.share==='half')));
  el('whoList').innerHTML=people().map(w=>`<option value="${esc(w)}">`).join('');
  const today=new Date(), tk=mKey(today);
  el('txDate').value = (CUR===tk) ? today.toISOString().slice(0,10) : CUR+'-15';
  el('txCats').innerHTML=S.cats.map((c,i)=>`<button type="button" class="chip" data-c="${esc(c.id)}" aria-pressed="${i===0}">${c.em} ${esc(c.id)}</button>`).join('');
  el('revChips').innerHTML=REV_PRESETS.map(l=>`<button type="button" class="chip" data-rl="${esc(l)}">${esc(l)}</button>`).join('');
  setKind(kind||'dep');
  el('dlgTx').showModal();
  setTimeout(()=>el('txAmount').focus(),50);
}
function ensureMonth(k){ if(!S.months[k]) S.months[k]={rev:[],adj:0,b:{}}; return S.months[k]; }

/* ---------- créances ---------- */
function debts(){ if(!S.debts) S.debts=[]; return S.debts; }
function oweOf(txId){ return r2(debts().filter(d=>d.tx===txId && !d.paid).reduce((s,d)=>s+d.a,0)); }
function oweTotal(){ return r2(debts().filter(d=>!d.paid).reduce((s,d)=>s+d.a,0)); }
function people(){ return [...new Set(debts().map(d=>d.who))].sort((a,b)=>a.localeCompare(b,'fr')); }
function initials(n){ return (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?'; }
function payDebt(id){
  const d=debts().find(x=>x.id===id); if(!d||d.paid) return;
  const tk=mKey(new Date());
  const k = allMonths().indexOf(tk)>=0 ? tk : CUR;
  const r={id:uid(), l:'Remboursement — '+d.who, a:d.a, n:d.n||''};
  ensureMonth(k).rev.push(r);
  d.paid=true; d.pd=new Date().toISOString().slice(0,10); d.rev=r.id; d.rk=k;
  save(); bust(); render(); toast('Remboursement de '+fmt(d.a)+' enregistré');
}
function unpayDebt(id){
  const d=debts().find(x=>x.id===id); if(!d||!d.paid) return;
  if(d.rev && d.rk && S.months[d.rk]) S.months[d.rk].rev=S.months[d.rk].rev.filter(r=>r.id!==d.rev);
  d.paid=false; d.pd=null; d.rev=null; d.rk=null;
  save(); bust(); render(); toast('Remboursement annulé');
}

/* ---------- recherche globale ---------- */
let HILITE=null;
const norm = s => (s==null?'':String(s)).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function mark(txt, q){
  const t=String(txt||''); if(!q) return esc(t);
  const i=norm(t).indexOf(q); if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));
}
function search(qRaw){
  const q=norm(qRaw).trim();
  if(!q) return [];
  const num=parseFloat(qRaw.replace(',','.'));
  const numOk=isFinite(num)&&/[0-9]/.test(qRaw);
  const out=[];
  S.tx.forEach(t=>{
    const hay=[t.n,t.c].filter(Boolean);
    const hit=hay.some(h=>norm(h).includes(q)) || (numOk && Math.abs(t.a-num)<0.005);
    if(hit) out.push({kind:'dep', id:t.id, k:t.d.slice(0,7), d:t.d,
      titre:t.n||t.c, sous:t.n?t.c:(t.imp?"importé de l'Excel":''), a:t.a, em:cat(t.c).em});
  });
  Object.keys(S.months).forEach(k=>{
    (S.months[k].rev||[]).forEach(r=>{
      const hay=[r.l,r.n].filter(Boolean);
      const hit=hay.some(h=>norm(h).includes(q)) || (numOk && Math.abs(r.a-num)<0.005);
      if(hit) out.push({kind:'rev', id:r.id, k, d:k+'-01', titre:r.l, sous:r.n||'', a:r.a, em:'💶'});
    });
  });
  out.sort((x,y)=> x.d===y.d ? 0 : (x.d<y.d?1:-1));
  return out;
}
function runSearch(){
  const qRaw=el('qInput').value;
  const q=norm(qRaw).trim();
  const res=search(qRaw);
  const box=el('qRes');
  if(!q){
    el('qCount').textContent='Cherche dans tes notes, tes catégories et tes libellés, sur tous les mois.';
    box.innerHTML=''; return;
  }
  const tot=res.reduce((s,r)=>s+(r.kind==='dep'?r.a:0),0);
  el('qCount').textContent = res.length
    ? `${res.length} résultat${res.length>1?'s':''}${tot>0?' · '+fmt(tot)+' de dépenses':''}`
    : 'Aucun résultat.';
  box.innerHTML = res.slice(0,200).map(r=>`
    <button type="button" class="sres" data-res="${r.kind}:${r.id}:${r.k}">
      <div class="ico">${r.em}</div>
      <div class="m"><div class="n">${mark(r.titre,q)}</div>${r.sous?`<div class="c">${mark(r.sous,q)}</div>`:''}</div>
      <div class="a tnum"><span style="color:${r.kind==='rev'?'var(--brand)':'inherit'}">${r.kind==='rev'?sgn(r.a):fmt(r.a)}</span><span class="mo">${mLabel(r.k,true)}</span></div>
    </button>`).join('')
    + (res.length>200?'<p class="hint" style="text-align:center">200 premiers résultats affichés.</p>':'');
}
function gotoResult(kind, id, k){
  el('dlgSearch').close();
  CUR=k; TAB='tx'; FILTER=null; HILITE=id;
  render();
  requestAnimationFrame(()=>{
    const n=el('r-'+id);
    if(n) n.scrollIntoView({behavior:'smooth',block:'center'});
    else { const c=el(kind==='rev'?'cardRev':'cardDep'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); }
    setTimeout(()=>{ HILITE=null; },3000);
  });
}

function openSolde(){
  const fin=soldes()[CUR].fin;
  el('soldeVal').value=fin.toFixed(2);
  el('soldeHint').textContent=`Calculé pour la fin ${deMois(CUR)} : ${fmt(fin)}. Indique le montant réel, l'écart sera enregistré comme un ajustement sur ce mois.`;
  const adj=(S.months[CUR]&&S.months[CUR].adj)||0;
  el('soldeAdj').innerHTML = adj ? `Ajustement déjà en place sur ce mois : <b>${sgn(adj)}</b>. <button type="button" class="btn sm" style="margin-left:6px" data-act="clearadj">Le retirer</button>` : '';
  el('dlgSolde').showModal();
  setTimeout(()=>{el('soldeVal').focus(); el('soldeVal').select();},50);
}

let PICKY=null;
function openMonthPicker(){ PICKY=+CUR.slice(0,4); renderPicker(); el('dlgMonth').showModal(); }
function renderPicker(){
  const ms=allMonths();
  const y0=+ms[0].slice(0,4), y1=+ms[ms.length-1].slice(0,4);
  PICKY=Math.min(y1, Math.max(y0, PICKY));
  el('yLbl').textContent=PICKY;
  el('yPrev').disabled = PICKY<=y0;
  el('yNext').disabled = PICKY>=y1;
  const g=el('mGrid'); g.innerHTML='';
  for(let m=1;m<=12;m++){
    const k=PICKY+'-'+String(m).padStart(2,'0');
    const dispo=ms.indexOf(k)>=0;
    const x=dispo?agg(k):null;
    const b=document.createElement('button');
    b.type='button'; b.disabled=!dispo;
    b.setAttribute('aria-pressed', String(k===CUR));
    const lbl=new Intl.DateTimeFormat('fr-BE',{month:'short'}).format(new Date(PICKY,m-1,1)).replace('.','');
    b.innerHTML=`<span>${lbl}</span><i class="mdot${(x&&(x.rev||x.dep))?'':' off'}"></i>`;
    b.addEventListener('click',()=>{ CUR=k; el('dlgMonth').close(); render(); window.scrollTo({top:0,behavior:'smooth'}); });
    g.appendChild(b);
  }
}

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-tab],[data-act],[data-filter],[data-deltx],[data-delrev],[data-goto],[data-hcat],[data-cdel],[data-c],[data-rmode],[data-jump],[data-catf],[data-kind],[data-rl],[data-res],[data-share],[data-pay],[data-unpay],[data-deldebt]');
  if(!t) return;
  if(t.dataset.share){ setShare(t.dataset.share); return; }
  if(t.dataset.pay){ payDebt(t.dataset.pay); return; }
  if(t.dataset.unpay){ unpayDebt(t.dataset.unpay); return; }
  if(t.dataset.deldebt){ S.debts=debts().filter(d=>d.id!==t.dataset.deldebt); save(); bust(); render(); toast('Ligne supprimée'); return; }
  if(t.dataset.res){ const [kd,id,k]=t.dataset.res.split(':'); gotoResult(kd,id,k); return; }
  if(t.dataset.kind){ setKind(t.dataset.kind); return; }
  if(t.dataset.rl){
    el('revLbl2').value = t.dataset.rl==='Autre' ? '' : t.dataset.rl;
    el('revChips').querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', String(b===t)));
    if(t.dataset.rl==='Autre') el('revLbl2').focus();
    return;
  }
  if(t.dataset.catf){
    TAB='tx'; FILTER=t.dataset.catf; render();
    requestAnimationFrame(()=>{ const n=el('cardDep'); if(n) n.scrollIntoView({behavior:'smooth',block:'start'}); });
    return;
  }
  if(t.dataset.jump!==undefined){
    const [tab,anchor]=t.dataset.jump.split(':');
    TAB=tab; FILTER=null; render();
    requestAnimationFrame(()=>{
      const n=anchor && el(anchor);
      if(n) n.scrollIntoView({behavior:'smooth',block:'start'});
      else window.scrollTo({top:0,behavior:'smooth'});
    });
    return;
  }
  if(t.dataset.rmode){ S.reportMode=t.dataset.rmode; save(); bust(); render(); return; }
  if(t.dataset.tab){ TAB=t.dataset.tab; FILTER=null; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.c!==undefined && t.closest('#txCats')){
    el('txCats').querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', b===t));
    return;
  }
  if(t.dataset.filter!==undefined){ FILTER=t.dataset.filter||null; renderTx(); return; }
  if(t.dataset.hcat){ HCAT=t.dataset.hcat; renderHist(); return; }
  if(t.dataset.goto){ CUR=t.dataset.goto; render(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if(t.dataset.deltx){
    S.tx=S.tx.filter(x=>x.id!==t.dataset.deltx);
    debts().filter(d=>d.tx===t.dataset.deltx && d.paid).forEach(d=>unpayDebt(d.id));
    S.debts=debts().filter(d=>d.tx!==t.dataset.deltx);
    save(); render(); toast('Dépense supprimée'); return; }
  if(t.dataset.delrev){ const M=S.months[CUR]; if(M){M.rev=M.rev.filter(r=>r.id!==t.dataset.delrev);} save(); render(); toast('Revenu supprimé'); return; }
  if(t.dataset.cdel){
    const id=t.dataset.cdel;
    const n=S.tx.filter(x=>x.c===id).length;
    if(n && !confirm(`« ${id} » contient ${n} dépense(s). Elles seront déplacées vers « Divers ». Continuer ?`)) return;
    S.tx.forEach(x=>{ if(x.c===id) x.c='Divers'; });
    if(!S.cats.some(c=>c.id==='Divers')) S.cats.push({id:'Divers',em:'✨',grp:'l',budget:0,report:true});
    S.cats=S.cats.filter(c=>c.id!==id);
    save(); render(); return;
  }
  const a=t.dataset.act;
  if(a==='addtx'){ openTx('dep'); }
  else if(a==='addrev'){ openTx('rev'); }
  else if(a==='adddebt'){
    el('ndWho').value=''; el('ndAmt').value=''; el('ndNote').value='';
    el('ndDate').value=new Date().toISOString().slice(0,10);
    el('whoList2').innerHTML=people().map(w=>`<option value="${esc(w)}">`).join('');
    el('dlgDebt').showModal(); setTimeout(()=>el('ndWho').focus(),50);
  }
  else if(a==='clearadj'){
    if(S.months[CUR]) S.months[CUR].adj=0;
    save(); bust(); el('dlgSolde').close(); render(); toast('Ajustement retiré');
  }
  else if(a==='addcat'){
    const nom=prompt('Nom de la nouvelle catégorie :'); if(!nom) return;
    if(S.cats.some(c=>c.id===nom.trim())){ toast('Cette catégorie existe déjà'); return; }
    S.cats.push({id:nom.trim(), em:'•', grp:'l', budget:0, report:true}); save(); render();
  }
  else if(a==='resetreport'){
    S.reportFrom = CUR; save(); bust(); render(); toast('Reports remis à zéro');
  }
  else if(a==='clearfrom'){ S.reportFrom=null; save(); bust(); render(); }
  else if(a==='export'){
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const dl=document.createElement('a');
    dl.href=url; dl.download='finances-'+new Date().toISOString().slice(0,10)+'.json'; dl.click();
    URL.revokeObjectURL(url); toast('Fichier exporté');
  }
  else if(a==='csv'){
    const rows=[['date','categorie','groupe','montant','note']];
    S.tx.slice().sort((x,y)=>x.d<y.d?-1:1).forEach(t=>rows.push([t.d,t.c,GRP_NAME[cat(t.c).grp],String(t.a).replace('.',','),t.n||'']));
    const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    const dl=document.createElement('a'); dl.href=url; dl.download='depenses.csv'; dl.click(); URL.revokeObjectURL(url);
  }
  else if(a==='import'){ el('fileIn').click(); }
  else if(a==='reset'){
    if(!confirm('Effacer définitivement toutes les données de cette application ? Pense à exporter avant.')) return;
    S=buildFromSeed(); save(); CUR=null; render(); toast('Données réinitialisées');
  }
});

document.addEventListener('change', e=>{
  const t=e.target;
  if(t.id==='fileIn' && t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{ try{ const p=JSON.parse(fr.result); if(!p.cats||!p.tx) throw 0; S=p; save(); CUR=null; render(); toast('Données importées'); }
      catch(err){ toast('Fichier illisible'); } };
    fr.readAsText(t.files[0]); return;
  }
  if(t.id==='solde0'){
    const v=numFR(t.value);
    if(isNaN(v)){ toast('Montant invalide'); return; }
    S.solde0=v; save(); bust(); renderHero(); renderSet(); toast('Solde de départ mis à jour'); return; }
  if(t.dataset.cbd!==undefined){ const c=cat(t.dataset.cbd); const v=numFR(t.value); c.budget=isNaN(v)?0:v; save(); bust(); return; }
  if(t.dataset.crp!==undefined){ const c=cat(t.dataset.crp); c.report=t.checked; save(); bust(); return; }
  if(t.dataset.cgr!==undefined){ const c=cat(t.dataset.cgr); c.grp=t.value; save(); bust(); return; }
  if(t.dataset.cem!==undefined){ const c=cat(t.dataset.cem); c.em=t.value.trim()||'•'; save(); return; }
  if(t.dataset.cnm!==undefined){
    const old=t.dataset.cnm, nv=t.value.trim();
    if(!nv || nv===old) return;
    if(S.cats.some(c=>c.id===nv)){ toast('Ce nom existe déjà'); t.value=old; return; }
    const c=cat(old); c.id=nv;
    S.tx.forEach(x=>{ if(x.c===old) x.c=nv; });
    Object.values(S.months).forEach(m=>{ if(m.b&&m.b[old]!=null){ m.b[nv]=m.b[old]; delete m.b[old]; } });
    if(HCAT===old) HCAT=nv;
    save(); bust(); render(); return;
  }
  if(t.dataset.mbd!==undefined){
    const M=ensureMonth(CUR); const v=t.value.trim();
    if(v==='') delete M.b[t.dataset.mbd]; else { const n=numFR(v); M.b[t.dataset.mbd]=isNaN(n)?0:n; }
    save(); bust(); return;
  }
});

el('frmTx').addEventListener('submit', e=>{
  const amt=numFR(el('txAmount').value);
  if(!isFinite(amt)||amt===0){ e.preventDefault(); toast('Indique un montant'); return; }
  const d=el('txDate').value || (CUR+'-15');
  const k=d.slice(0,7);
  if(KIND==='dep'){
    const sel=el('txCats').querySelector('[aria-pressed="true"]');
    if(!sel){ e.preventDefault(); toast('Choisis une catégorie'); return; }
    const tid=uid();
    S.tx.push({id:tid, d, c:sel.dataset.c, a:r2(amt), n:el('txNote').value.trim(), imp:0});
    let due=0;
    if(el('debtOn').checked){
      const who=el('debtWho').value.trim();
      const da=numFR(el('debtAmt').value);
      if(who && isFinite(da) && da>0){
        due=r2(Math.min(da, r2(amt)));
        debts().push({id:uid(), who, a:due, d, n:el('txNote').value.trim(), tx:tid, paid:false, pd:null, rev:null, rk:null});
      }
    }
    ensureMonth(k); CUR=k; save();
    setTimeout(()=>{render(); toast('− '+fmt(amt)+' · '+sel.dataset.c+(due?` · ${fmt(due)} dû`:''));},0);
  } else {
    const lbl=el('revLbl2').value.trim() || 'Revenu';
    ensureMonth(k).rev.push({id:uid(), l:lbl, a:r2(amt), n:el('txNote').value.trim()});
    CUR=k; save();
    setTimeout(()=>{render(); toast('+ '+fmt(amt)+' · '+lbl);},0);
  }
});
el('txCancel').addEventListener('click',()=>el('dlgTx').close());
el('fab').addEventListener('click',()=>{
  if(TAB==='debt'){ document.querySelector('[data-act=\"adddebt\"]')?.click(); }
  else openTx('dep');
});
el('curM').addEventListener('click',openMonthPicker);
el('heroAmount').addEventListener('click',openSolde);
el('soldeCancel').addEventListener('click',()=>el('dlgSolde').close());
el('frmSolde').addEventListener('submit', e=>{
  const v=numFR(el('soldeVal').value);
  if(!isFinite(v)){ e.preventDefault(); return; }
  const M=ensureMonth(CUR);
  M.adj = r2((M.adj||0) + (v - soldes()[CUR].fin));
  save(); bust();
  setTimeout(()=>{render(); toast('Solde corrigé');},0);
});
el('debtOn').addEventListener('change',toggleDebt);
el('txAmount').addEventListener('input',syncDebtAmt);
el('ndCancel').addEventListener('click',()=>el('dlgDebt').close());
el('frmDebt').addEventListener('submit', e=>{
  const who=el('ndWho').value.trim(), a=numFR(el('ndAmt').value);
  if(!who||!isFinite(a)||a<=0){ e.preventDefault(); return; }
  debts().push({id:uid(), who, a:r2(a), d:el('ndDate').value||new Date().toISOString().slice(0,10),
                n:el('ndNote').value.trim(), tx:null, paid:false, pd:null, rev:null, rk:null});
  save(); bust(); setTimeout(()=>{render(); toast(who+' te doit '+fmt(a));},0);
});
el('searchBtn').addEventListener('click',()=>{
  el('qInput').value=''; runSearch(); el('dlgSearch').showModal();
  setTimeout(()=>el('qInput').focus(),60);
});
el('qClose').addEventListener('click',()=>el('dlgSearch').close());
el('qInput').addEventListener('input',runSearch);
el('qInput').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); const f=el('qRes').querySelector('.sres'); if(f) f.click(); }
});
el('mCancel').addEventListener('click',()=>el('dlgMonth').close());
el('yPrev').addEventListener('click',()=>{PICKY--;renderPicker();});
el('yNext').addEventListener('click',()=>{PICKY++;renderPicker();});
el('prevM').addEventListener('click',()=>{ const ms=allMonths(),i=ms.indexOf(CUR); if(i>0){CUR=ms[i-1];render();} });
el('nextM').addEventListener('click',()=>{ const ms=allMonths(),i=ms.indexOf(CUR); if(i<ms.length-1){CUR=ms[i+1];render();} });
el('themeBtn').addEventListener('click',()=>{
  const cur=document.documentElement.getAttribute('data-theme')||
    (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');

  document.documentElement.setAttribute('data-theme',nx);

let rzW=innerWidth, rzT;
addEventListener('resize', ()=>{

  rzW=innerWidth; clearTimeout(rzT);

    e.preventDefault(); el('searchBtn').click(); return; }
  if(e.key==='n' && !/input|select|textarea/i.test(e.target.tagName) && !document.querySelector('dialog[open]')){ e.preventDefault(); openTx('dep'); }
});

/* pas de zoom : ni double-tap (touch-action), ni pincement */
['gesturestart','gesturechange','gestureend'].forEach(ev=>
  document.addEventListener(ev, e=>e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e=>{ if(e.touches.length>1) e.preventDefault(); }, {passive:false});

/* ===================== DÉMARRAGE ===================== */
(function init(){
  try{ const th=localStorage.getItem('fin_theme'); if(th) document.documentElement.setAttribute('data-theme',th);
       else if(matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme','dark'); }catch(e){}
  S=load();
  S.cats.forEach(c=>{ if(c.report===undefined) c.report=true; });
  if(!Array.isArray(S.debts)) S.debts=[];
  render();
})();
