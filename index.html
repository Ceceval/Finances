<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mes finances</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mes finances">
<meta name="theme-color" content="#0f5334">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{
  color-scheme: light;
  --bg:#f2f6f1; --surface:#ffffff; --surface-2:#f4f8f2; --surface-3:#eaf1e8;
  --border:#dfe7dc; --border-strong:#c8d4c4;
  --text:#122019; --text-2:#54655b; --text-3:#8b988f;
  --brand:#1b7f4f; --brand-2:#14663f; --brand-soft:#e7f3ec; --brand-ink:#0f5334;
  --s1:#1baf7a; --s2:#eb6834; --s3:#4a3aa7;
  --indisp:#eda100; --indisp-ink:#8a5a00; --indisp-soft:#fdf3dc;
  --loisir:#4a3aa7; --loisir-ink:#3b2e85; --loisir-soft:#eeecfa;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --grid:#e8eee6;
  --shadow:0 1px 2px rgba(18,32,25,.05), 0 8px 24px -12px rgba(18,32,25,.18);
  --shadow-lg:0 2px 4px rgba(18,32,25,.06), 0 20px 48px -20px rgba(18,32,25,.28);
  --r:14px; --r-sm:10px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#101410; --surface:#181d18; --surface-2:#1f251f; --surface-3:#262d26;
  --border:#2c342c; --border-strong:#3c463c;
  --text:#ffffff; --text-2:#b3c0b6; --text-3:#859388;
  --brand:#35c184; --brand-2:#2aa971; --brand-soft:#16281f; --brand-ink:#7fe0b4;
  --s1:#199e70; --s2:#d95926; --s3:#9085e9;
  --indisp:#c98500; --indisp-ink:#f0c579; --indisp-soft:#332812;
  --loisir:#9085e9; --loisir-ink:#b9b1f2; --loisir-soft:#221f38;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --grid:#252c25;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 20px 48px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));
  overscroll-behavior-y:contain;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;-webkit-user-select:none;user-select:none}
.tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------- layout ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px))}
header.top{
  background:linear-gradient(165deg,#0f5334 0%,#1b7f4f 60%,#25a468 100%);
  color:#fff; padding:14px 0 84px; position:relative;
}
:root[data-theme="dark"] header.top{background:linear-gradient(165deg,#0c3b26 0%,#12603c 60%,#17754a 100%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brandmark{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em;font-size:15px;opacity:.95}
.brandmark svg{display:block}
.icon-btn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.14);transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.24)}
.hero{margin-top:20px;text-align:center}
.hero .lbl{font-size:12.5px;text-transform:uppercase;letter-spacing:.09em;opacity:.72;font-weight:600}
.hero .amountline{margin:4px 0 0;display:block;width:100%}
.hero .amount{font-size:clamp(40px,10vw,58px);font-weight:700;letter-spacing:-.03em;line-height:1.05;
  color:#fff;display:inline-flex;align-items:center;gap:10px;padding:2px 10px;border-radius:14px;transition:background .15s}
.hero .amount:hover{background:rgba(255,255,255,.13)}
.hero .amount .pen{opacity:.5;flex:none}
.hero .amount:hover .pen{opacity:.85}
.hero .delta{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;font-weight:600;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:99px}
.monthnav{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px}
.monthnav button{color:#fff;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.monthnav button:hover{background:rgba(255,255,255,.24)}
.monthnav button[disabled]{opacity:.3;cursor:default}
.monthnav .m{min-width:150px;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;
  font-weight:650;font-size:14.5px;text-transform:capitalize;padding:6px 12px;border-radius:10px;transition:background .15s}
.monthnav .m:hover{background:rgba(255,255,255,.16)}
.yearnav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.yearnav button{width:36px;height:36px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border-strong);display:grid;place-items:center;color:var(--text-2)}
.yearnav button:hover:not(:disabled){background:var(--surface-3);color:var(--text)}
.yearnav button:disabled{opacity:.3;cursor:default}
.yearnav .y{font-size:19px;font-weight:700;min-width:78px;text-align:center;letter-spacing:-.01em}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{padding:13px 6px 11px;border-radius:11px;border:1.5px solid var(--border-strong);background:var(--surface);
  font-size:14px;font-weight:600;text-transform:capitalize;color:var(--text-2);display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s}
.mgrid button:hover:not(:disabled){border-color:var(--brand);color:var(--text)}
.mgrid button:disabled{opacity:.3;cursor:default}
.mgrid button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.mdot{width:5px;height:5px;border-radius:99px;background:var(--brand);display:block}
.mgrid button[aria-pressed="true"] .mdot{background:#fff}
.mdot.off{background:transparent}

nav.tabs{
  position:sticky;top:0;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);
  margin-top:-56px;border-radius:var(--r) var(--r) 0 0;box-shadow:var(--shadow);
}
.tabs-inner{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:6px}
.tabs-inner::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--text-2);white-space:nowrap;display:flex;align-items:center;gap:7px;justify-content:center;transition:.15s}
.tab:hover{background:var(--surface-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--brand-soft);color:var(--brand-ink)}
.tab .sm2{display:none}
@media(max-width:820px){
  input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{font-size:16px !important}
  .catedit{grid-template-columns:auto 1fr 88px auto;gap:6px}
  .catedit input[type=text],.catedit input[type=number],.catedit select{padding:8px 8px}
}
@media(max-width:560px){
  .tabs-inner{padding:5px}
  .tab{flex:1 1 0;min-width:0;padding:8px 2px;font-size:10px;gap:3px;flex-direction:column;letter-spacing:-.01em}
  .tab svg{width:17px;height:17px}
  .tab .lg{display:none}
  .tab .sm2{display:inline}
  .hero .amount{font-size:clamp(34px,9.5vw,50px)}
  .card{padding:15px}
  .tblwrap{margin:0 -15px;padding:0 15px}
}
main{padding-top:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px;scroll-margin-top:78px}
.card h2{margin:0 0 2px;font-size:15px;font-weight:650;letter-spacing:-.01em}
.card .sub{margin:0 0 14px;font-size:12.5px;color:var(--text-3)}
.grid{display:grid;gap:14px}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:620px){.tiles{grid-template-columns:1fr;gap:8px}}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow)}
.tile .t{font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--text-3);display:flex;align-items:center;gap:6px}
.tile .v{font-size:25px;font-weight:700;letter-spacing:-.02em;margin-top:5px;line-height:1.1}
.tile .h{font-size:12px;color:var(--text-3);margin-top:2px}
.tile-btn{text-align:left;width:100%;cursor:pointer;transition:border-color .15s, transform .15s, box-shadow .15s}
.tile-btn:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.tile-btn:active{transform:translateY(0)}
.tchev{margin-left:auto;opacity:.45;flex:none}
.dot{width:8px;height:8px;border-radius:3px;display:inline-block;flex:none}

/* ---------- budget rows ---------- */
.brow{padding:12px 0;border-bottom:1px solid var(--border)}
.brow-btn{display:block;width:calc(100% + 16px);margin-left:-8px;text-align:left;cursor:pointer;
  padding-left:8px;padding-right:8px;border-radius:10px;transition:background .15s}
.brow-btn:hover{background:var(--surface-2)}
.brow-chev{margin-left:auto;opacity:.4;flex:none}
.brow:last-child{border-bottom:none;padding-bottom:0}
.brow:first-child{padding-top:0}
.brow-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.brow-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.brow-name .em{font-size:15px;line-height:1;flex:none}
.brow-val{font-size:13px;color:var(--text-2);white-space:nowrap}
.brow-val b{color:var(--text);font-weight:650}
.track{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden;display:flex;gap:2px}
.fill{height:100%;border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1);min-width:0}
.brow-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;margin-top:6px;font-size:12px;color:var(--text-3)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:650}
.pill.ok{background:var(--brand-soft);color:var(--brand-ink)}
.pill.warn{background:#fff4dd;color:#8a5a00}
.pill.crit{background:#fdeaea;color:#a12626}
:root[data-theme="dark"] .pill.warn{background:#3a2e12;color:#f5c86a}
:root[data-theme="dark"] .pill.crit{background:#3a1e1e;color:#f09a9a}
.gcard{border-top:4px solid var(--gc);padding-top:15px}
.ghead{cursor:pointer;border-radius:10px;transition:background .15s}
.ghead:hover{background:var(--surface-2)}
.gchev{flex:none;color:var(--text-3);transition:transform .2s}
.gcard.open .gchev,.brow-btn.open .brow-chev{transform:rotate(90deg)}
.subs{padding:2px 0 6px 30px;margin-top:-2px}
.srow{display:flex;align-items:center;gap:9px;width:100%;padding:8px 8px 8px 0;border-radius:9px;text-align:left;cursor:pointer;transition:background .15s;position:relative}
.srow:hover{background:var(--surface-2)}
.srow::before{content:'';position:absolute;left:-14px;top:0;bottom:0;width:2px;background:var(--border);border-radius:2px}
.srow .sn{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sc{font-size:11.5px;color:var(--text-3);font-weight:500}
.srow .sa{font-weight:650;font-size:13.5px;white-space:nowrap}
.srow .schev{opacity:.35;flex:none}
.srow.all{font-style:normal}
.srow.all .sn{color:var(--text-3);font-weight:600}
.bhead{display:grid;grid-template-columns:34px minmax(0,1fr) 84px 66px 48px;gap:5px;align-items:center;
  padding-bottom:7px;border-bottom:1px solid var(--border-strong);margin-bottom:4px}
.bhead span{font-size:10px;font-weight:650;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
.bhead span:nth-child(4){text-align:right;padding-right:6px}
.bhead span:nth-child(5){text-align:center;font-size:9px}
.bcat{display:grid;grid-template-columns:34px minmax(0,1fr) 84px 66px 48px;gap:5px;align-items:center;padding:9px 0 7px}
.bcat input,.bcat select{padding:8px 7px}
.bcat .bem{width:34px;text-align:center;padding-left:0;padding-right:0}
.bcat .bbud{text-align:right}
.bcat .bsum{text-align:right;font-weight:700;font-size:14px;padding-right:7px}
.bcat .bsum small{display:block;font-size:9.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.bcat .bact{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.bcat .bact .del{width:24px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--text-3);opacity:.6}
.bcat .bact .del:hover{opacity:1;color:var(--crit);background:var(--surface-3)}
.bsubs{margin:0 0 10px 16px;padding-left:14px;border-left:2px solid var(--border)}
.bsub{display:grid;grid-template-columns:minmax(0,1fr) 66px 26px;gap:5px;align-items:center;padding:4px 0}
.bsub input{padding:7px 8px;font-size:13.5px}
.bsub input[type=text]{border-color:var(--border)}
.bsub .bbud{text-align:right}
.bsub .del{width:24px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--text-3);opacity:.55}
.bsub .del:hover{opacity:1;color:var(--crit);background:var(--surface-3)}
.baddsub{font-size:12.5px;font-weight:650;color:var(--brand);padding:6px 0 2px}
.baddsub:hover{text-decoration:underline}
.bsep{height:1px;background:var(--border);margin:2px 0}
@media(max-width:700px){
  .bhead,.bcat{grid-template-columns:30px minmax(0,1fr) 74px 58px 44px;gap:4px}
  .bcat .bem{width:30px}
  .bsub{grid-template-columns:minmax(0,1fr) 58px 24px}
}
.gcard.gi{--gc:var(--indisp);--gcink:var(--indisp-ink);--gcsoft:var(--indisp-soft)}
.gcard.gl{--gc:var(--loisir);--gcink:var(--loisir-ink);--gcsoft:var(--loisir-soft)}
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.gicon{width:40px;height:40px;border-radius:13px;background:var(--gcsoft);color:var(--gc);display:grid;place-items:center;flex:none}
.ghead .gt{flex:1;min-width:0}
.ghead h2{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--gcink);margin:0}
.ghead .gs{font-size:12px;color:var(--text-3);margin:1px 0 0}
.ghead .gv{text-align:right;white-space:nowrap;font-size:16px;font-weight:700}
.ghead .gv span{display:block;font-size:12px;font-weight:600;color:var(--text-3)}
.group-label{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.group-label:first-child{margin-top:0}
.group-label span.amt{margin-left:auto;color:var(--text-2);letter-spacing:0;text-transform:none;font-size:12.5px}

/* ---------- forms ---------- */
label.f{display:block;font-size:12px;font-weight:650;color:var(--text-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);
  background:var(--surface);outline:none;transition:.15s;font-size:15px
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:var(--r-sm);font-weight:650;font-size:14px;background:var(--surface-2);color:var(--text);border:1px solid var(--border-strong);transition:.15s}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger{color:var(--crit);border-color:var(--border-strong)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) 92px 30px;gap:6px;align-items:center;margin-bottom:7px}
.drow input{padding:9px 10px}
.drow .del{opacity:.55;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--text-3)}
.drow .del:hover{background:var(--surface-3);color:var(--crit)}
.chip{padding:8px 13px;border-radius:99px;border:1.5px solid var(--border-strong);font-size:13.5px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;gap:6px;transition:.15s;background:var(--surface)}
.chip:hover{border-color:var(--brand);color:var(--text)}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.amount-input{position:relative}
.amount-input input{font-size:34px;font-weight:700;padding:14px 46px 14px 16px;letter-spacing:-.02em;text-align:right}
.amount-input .cur{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:600;color:var(--text-3);pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2.one{grid-template-columns:1fr}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- tx list ---------- */
.daygroup{margin-top:16px}
.daygroup:first-child{margin-top:0}
.dayhead{display:flex;justify-content:space-between;font-size:12px;font-weight:650;color:var(--text-3);text-transform:capitalize;padding-bottom:6px;border-bottom:1px solid var(--border)}
.tx{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.tx[data-edittx],.tx[data-editrev]{cursor:pointer;border-radius:10px;transition:background .15s}
.tx[data-edittx]:hover,.tx[data-editrev]:hover{background:var(--surface-2)}
.tx[data-edittx],.tx[data-editrev]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tx.sel{background:var(--brand-soft)}
.tx.sel .ico{background:var(--brand);color:#fff}
.tx.sel .n{color:var(--brand-ink)}
body.selmode .tx[data-edittx],body.selmode .tx[data-editrev]{padding-left:2px}
body.selmode .fab{opacity:0;pointer-events:none}

#selWrap[hidden],#selTrash[hidden]{display:none!important}
#selWrap{position:fixed;z-index:70;display:flex;flex-direction:column;align-items:flex-start;gap:10px;touch-action:none}
#selBubble{width:58px;height:58px;border-radius:50%;background:var(--text);color:var(--surface);
  display:grid;place-items:center;box-shadow:0 10px 30px -8px rgba(0,0,0,.55);cursor:grab;touch-action:none;flex:none}
#selBubble:active{cursor:grabbing}
#selCount{font-size:21px;font-weight:700;line-height:1}
#selPanel{background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;
  box-shadow:var(--shadow-lg);padding:14px;width:min(272px,calc(100vw - 32px))}
.sp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.sp-head b{font-size:14px;font-weight:650}
.sp-head button{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--text-3)}
.sp-head button:hover{background:var(--surface-2);color:var(--text)}
.sp-row{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--border)}
.sp-row:last-of-type{border-bottom:none}
.sp-row b{font-weight:700}
.sp-tot{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:8px 0 4px}
.sp-acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.sp-acts button{flex:1 1 auto;padding:9px 12px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--surface-2);font-size:13px;font-weight:650;white-space:nowrap}
.sp-acts button:hover{background:var(--surface-3)}
.sp-acts button.d{color:var(--crit)}
#selTrash{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);
  width:66px;height:66px;border-radius:50%;background:var(--surface);color:var(--text-3);display:grid;place-items:center;
  z-index:69;border:2px dashed var(--border-strong);transition:transform .15s, background .15s, color .15s}
#selTrash.hot{background:var(--crit);color:#fff;border-color:transparent;transform:translateX(-50%) scale(1.18)}
.tx:last-child{border-bottom:none}
.tx .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none;background:var(--surface-3)}
.tx .m{flex:1;min-width:0}
.tx .m .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .m .c{font-size:12px;color:var(--text-3)}
.tx .a{font-weight:650;font-size:15px;white-space:nowrap}
.tx .del{opacity:0;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);flex:none;transition:.15s}
.tx:hover .del,.tx:focus-within .del{opacity:1}
.tx .del:hover{background:var(--surface-3);color:var(--crit)}
@media(hover:none){.tx .del{opacity:.5}}
.owe{display:inline-flex;align-items:center;gap:4px;background:#fdeaea;color:#a12626;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.owe::before{content:'';width:5px;height:5px;border-radius:99px;background:currentColor;flex:none}
:root[data-theme="dark"] .owe{background:#3a1e1e;color:#f09a9a}
.back{display:inline-flex;align-items:center;gap:4px;background:var(--brand-soft);color:var(--brand-ink);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;white-space:nowrap}
.back::before{content:'';width:5px;height:5px;border-radius:99px;background:currentColor;flex:none}
.gross{color:var(--text-3);font-size:12px;font-weight:600;text-decoration:line-through;margin-right:6px}
.banner.owe-b{background:#fdeaea;color:#a12626;cursor:pointer}
:root[data-theme="dark"] .banner.owe-b{background:#3a1e1e;color:#f09a9a}
.person{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:18px 0 6px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.person:first-of-type{margin-top:0}
.person .pn{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:8px}
.person .pav{width:30px;height:30px;border-radius:99px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}
.person .pt{font-weight:700;font-size:14.5px;color:var(--crit)}
.dline{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.dline:last-child{border-bottom:none}
.dline .m{flex:1;min-width:0}
.dline .m .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dline .m .c{font-size:11.5px;color:var(--text-3)}
.dline .a{font-weight:650;font-size:14px;white-space:nowrap}
.dline.done .m .n,.dline.done .a{color:var(--text-3);text-decoration:line-through}
@media(max-width:560px){
  .dline{flex-wrap:wrap;row-gap:9px;padding:11px 0}
  .dline .m{flex:1 1 100%}
  .dline .a{flex:1 1 auto}
}
.empty{text-align:center;padding:34px 16px;color:var(--text-3);font-size:13.5px}
.tx.hl{background:var(--brand-soft);border-radius:12px;box-shadow:0 0 0 8px var(--brand-soft);animation:flash 2.6s ease-out forwards}
@keyframes flash{0%,55%{background:var(--brand-soft);box-shadow:0 0 0 8px var(--brand-soft)}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
.sres{display:flex;align-items:center;gap:11px;padding:10px 8px;width:calc(100% + 16px);margin-left:-8px;border-radius:11px;text-align:left;cursor:pointer;transition:background .15s}
.sres:hover{background:var(--surface-2)}
.sres .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none;background:var(--surface-3)}
.sres .m{flex:1;min-width:0}
.sres .m .n{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres .m .c{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres .a{font-weight:650;font-size:14.5px;white-space:nowrap;text-align:right;flex:none}
.sres .a .mo{display:block;font-size:11.5px;font-weight:600;color:var(--text-3);text-transform:capitalize;margin-top:2px}
.sres mark{background:#fff2a8;color:inherit;border-radius:3px;padding:0 1px}
:root[data-theme="dark"] .sres mark{background:#5a4a12;color:#ffe89a}
#dlgSearch{max-width:520px}
#qRes{max-height:min(52vh,440px);overflow-y:auto;margin:0 -8px}
.qbar{position:relative}
.qbar svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.qbar input{padding-left:40px}
.empty .big{font-size:34px;display:block;margin-bottom:8px;opacity:.5}

/* ---------- table ---------- */
.tblwrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.data{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
table.data th{text-align:right;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);font-weight:650;padding:0 10px 8px;border-bottom:1px solid var(--border)}
table.data th:first-child,table.data td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
table.data td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--border)}
table.data tr:last-child td{border-bottom:none}
table.data tr.cur td{background:var(--brand-soft)}
table.data tr.cur td:first-child{background:var(--brand-soft)}
.pos{color:var(--brand)}.neg{color:var(--crit)}
:root[data-theme="dark"] .pos{color:var(--brand)}

/* ---------- chart ---------- */
.chartbox{position:relative}
svg.chart{display:block;width:100%;overflow:visible}
svg.chart text{font-size:10.5px;fill:var(--text-3);font-family:inherit}
svg.chart .axlabel{font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12.5px;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-lg);padding:9px 11px;font-size:12.5px;opacity:0;transition:opacity .12s;z-index:20;white-space:nowrap}
.tip .th{font-weight:650;margin-bottom:4px;text-transform:capitalize}
.tip .tr{display:flex;justify-content:space-between;gap:14px}
.tip .tr span:last-child{font-weight:650}

/* ---------- misc ---------- */
.banner{display:flex;gap:11px;align-items:flex-start;background:var(--brand-soft);border:1px solid transparent;border-radius:var(--r);padding:13px 15px;margin-bottom:14px;font-size:13.5px;color:var(--brand-ink)}
.banner.warn{background:#fff6e6;color:#7a5100}
:root[data-theme="dark"] .banner.warn{background:#332812;color:#f0c579}
.banner .bx{margin-left:auto;flex:none;opacity:.6}
.seg{display:inline-flex;background:var(--surface-3);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.07)}
.fab[hidden]{display:none}
.fab{position:fixed;right:max(16px,calc(50vw - 544px));bottom:calc(22px + env(safe-area-inset-bottom, 0px));z-index:50;width:58px;height:58px;padding:0;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;box-shadow:0 8px 28px -6px rgba(27,127,79,.55);transition:transform .15s, background .15s}
.fab:active{transform:scale(.94)}
.fab:hover{background:var(--brand-2)}
dialog{border:none;padding:0;border-radius:18px;background:var(--surface);color:var(--text);box-shadow:var(--shadow-lg);max-width:440px;width:calc(100% - 28px)}
dialog::backdrop{background:rgba(10,20,14,.5);backdrop-filter:blur(3px)}
.dlg{padding:20px}
.dlg h3{margin:0 0 16px;font-size:17px;font-weight:650}
.dlg-actions{display:flex;gap:9px;margin-top:18px}
.dlg-actions .btn{flex:1}
.hint{font-size:12px;color:var(--text-3);margin-top:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(26px + env(safe-area-inset-bottom, 0px));background:var(--text);color:var(--surface);padding:10px 12px 10px 18px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:99;opacity:0;transition:.25s;pointer-events:none;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
.toast.act{pointer-events:auto}
.toast button{color:#6ee7b7;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px;flex:none}
.toast button:hover{background:rgba(255,255,255,.26)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.catedit{display:grid;grid-template-columns:auto 1fr 96px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.ce{grid-template-columns:46px minmax(0,1fr) 152px 92px auto;align-items:center;grid-template-areas:"em nm gr bd ac";column-gap:8px}
.ce-em{grid-area:em;width:46px;text-align:center;padding-left:2px;padding-right:2px}
.ce-nm{grid-area:nm;min-width:0;width:100%}
.ce-gr{grid-area:gr;min-width:0;width:100%}
.ce-bd{grid-area:bd;min-width:0;width:100%;text-align:right}
.ce-ac{grid-area:ac;display:flex;gap:4px;align-items:center;justify-content:flex-end}
@media(max-width:700px){
  .ce{grid-template-columns:36px minmax(0,1fr) 88px 52px auto;column-gap:4px}
  .ce-em{width:36px;padding-left:0;padding-right:0}
  .ce-nm,.ce-gr,.ce-bd{padding-left:6px;padding-right:4px}
  .ce-ac{gap:0}
  .ce-ac .del{width:26px}
  .ce-hd{font-size:9.5px}
  .card:has(.ce){padding-left:12px;padding-right:12px}
}
.catedit:last-of-type{border-bottom:none}
.catedit input[type=text]{padding:7px 10px;font-size:14px}
.catedit input[type=number]{padding:7px 10px;font-size:14px;text-align:right}
.small{font-size:12.5px;color:var(--text-3)}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--border)}
.kv:last-child{border-bottom:none}
.kv b{font-weight:650}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="topbar">
      <div class="brandmark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4.5 0-8-3.2-8-7.6C4 8.6 8 4.5 12 2c4 2.5 8 6.6 8 11.4C20 17.8 16.5 21 12 21z"/><path d="M12 21V9"/><path d="M12 13l3-2.4"/><path d="M12 16.5 9 14"/></svg>
        Mes finances
      </div>
      <div style="display:flex;gap:6px">
        <button class="icon-btn" id="searchBtn" title="Rechercher" aria-label="Rechercher une opération">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" title="Thème clair / sombre" aria-label="Changer de thème">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </div>
    </div>
    <div class="hero">
      <div class="lbl">Solde au <span id="heroDate">—</span></div>
      <div class="amountline"><button class="amount" id="heroAmount" aria-label="Corriger le solde"><span class="tnum" id="heroVal">—</span><svg class="pen" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div>
      <div class="delta" id="heroDelta"></div>
      <div class="monthnav">
        <button id="prevM" aria-label="Mois précédent"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="m" id="curM" aria-haspopup="dialog"><span id="curMLbl">—</span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
        <button id="nextM" aria-label="Mois suivant"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" role="tablist">
    <div class="tabs-inner">
      <button class="tab" role="tab" data-tab="dash" aria-selected="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="lg">Accueil</span><span class="sm2">Accueil</span></button>
      <button class="tab" role="tab" data-tab="tx"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h12"/></svg><span class="lg">Dépenses</span><span class="sm2">Dépenses</span></button>
      <button class="tab" role="tab" data-tab="debt"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="lg">Comptes</span><span class="sm2">Comptes</span></button>
      <button class="tab" role="tab" data-tab="hist"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg><span class="lg">Historique</span><span class="sm2">Historique</span></button>
      <button class="tab" role="tab" data-tab="set"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg><span class="lg">Réglages</span><span class="sm2">Réglages</span></button>
    </div>
  </nav>
  <main>
    <section id="p-dash"></section>
    <section id="p-tx" hidden></section>
    <section id="p-debt" hidden></section>
    <section id="p-hist" hidden></section>
    <section id="p-set" hidden></section>
  </main>
</div>

<button class="fab" id="fab" aria-label="Ajouter une opération"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<dialog id="dlgTx"><form method="dialog" class="dlg" id="frmTx">
  <h3 id="txTitle">Ajouter</h3>
  <div class="stack">
    <div class="seg" style="display:flex;width:100%">
      <button type="button" style="flex:1" data-kind="dep" aria-pressed="true">Dépense</button>
      <button type="button" style="flex:1" data-kind="rev" aria-pressed="false">Revenu</button>
    </div>
    <div>
      <label class="f" for="txAmount">Montant</label>
      <div class="amount-input"><input id="txAmount" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" required><span class="cur">€</span></div>
    </div>
    <div id="wrapCats">
      <label class="f">Catégorie</label>
      <div class="chips" id="txCats"></div>
      <div id="wrapSubs" hidden style="margin-top:11px">
        <label class="f">Sous-catégorie <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--text-3)">(facultatif)</span></label>
        <div class="chips" id="txSubs"></div>
      </div>
    </div>
    <div id="wrapRev" hidden>
      <label class="f">Type de revenu</label>
      <div class="chips" id="revChips" style="margin-bottom:9px"></div>
      <input id="revLbl2" type="text" placeholder="Libellé" aria-label="Libellé du revenu">
    </div>
    <div id="wrapDebt">
      <label class="f" style="display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;font-size:14px;font-weight:600;cursor:pointer">
        <input type="checkbox" id="debtOn" style="width:20px;height:20px;accent-color:var(--brand)">
        Quelqu'un me doit une partie
      </label>
      <div id="debtFields" hidden style="margin-top:10px">
        <div id="debtList"></div>
        <button type="button" class="btn sm" id="debtAdd" style="margin-top:2px">+ Ajouter une personne</button>
        <div class="chips" id="debtModes" style="margin:10px 0 8px">
          <button type="button" class="chip" data-share="equal">À parts égales</button>
          <button type="button" class="chip" data-share="all">Ils paient tout</button>
          <button type="button" class="chip" data-share="custom">Montants libres</button>
        </div>
        <p class="hint" id="debtLeft" style="margin-top:0"></p>
        <datalist id="whoList"></datalist>
      </div>
    </div>
    <div>
      <label class="f">Moyen de paiement <span style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--text-3)">(facultatif)</span></label>
      <div class="chips" id="txPay"></div>
    </div>
    <div class="row2" id="rowDate">
      <div><label class="f" for="txDate">Date</label><input id="txDate" type="date" required></div>
      <div id="wrapNote"><label class="f" for="txNote">Note</label><input id="txNote" type="text" placeholder="ex. anniversaire de Léa"></div>
    </div>
  </div>
  <div class="dlg-actions">
    <button type="button" class="btn" id="txCancel">Annuler</button>
    <button type="submit" class="btn primary" id="txSubmit">Ajouter</button>
  </div>
</form></dialog>

<dialog id="dlgSolde"><form method="dialog" class="dlg" id="frmSolde">
  <h3>Corriger le solde</h3>
  <p class="sub" id="soldeHint" style="margin-bottom:14px"></p>
  <div class="stack">
    <div>
      <label class="f" for="soldeVal">Solde réel sur le compte</label>
      <div class="amount-input"><input id="soldeVal" type="text" inputmode="decimal" autocomplete="off" required><span class="cur">€</span></div>
    </div>
  </div>
  <p class="hint" id="soldeAdj"></p>
  <div class="dlg-actions">
    <button type="button" class="btn" id="soldeCancel">Annuler</button>
    <button type="submit" class="btn primary">Corriger</button>
  </div>
</form></dialog>

<dialog id="dlgDebt"><form method="dialog" class="dlg" id="frmDebt">
  <h3>Quelqu'un me doit</h3>
  <div class="stack">
    <div><label class="f" for="ndWho">Qui</label><input id="ndWho" type="text" placeholder="Prénom" list="whoList2" required><datalist id="whoList2"></datalist></div>
    <div><label class="f" for="ndAmt">Montant</label><div class="amount-input"><input id="ndAmt" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" required><span class="cur">€</span></div></div>
    <div class="row2">
      <div><label class="f" for="ndDate">Date</label><input id="ndDate" type="date" required></div>
      <div><label class="f" for="ndNote">Pourquoi</label><input id="ndNote" type="text" placeholder="ex. resto"></div>
    </div>
  </div>
  <div class="dlg-actions">
    <button type="button" class="btn" id="ndCancel">Annuler</button>

<div class="toast" id="toast"><span id="toastMsg"></span></div>
<script>
/* ===================== DONNÉES INITIALES (import Excel) ===================== */
const SEED={"solde0":0,"m":[]};

const CAT_DEF = [
  {id:'Courses',   em:'🛒', grp:'i', budget:84, subs:[]},
  {id:'Factures',  em:'🧾', grp:'i', budget:38, subs:[]},
  {id:'Santé',     em:'💊', grp:'i', budget:30, subs:[]},
  {id:'Voiture',   em:'🚗', grp:'i', budget:80, subs:[]},
  {id:'Nori',      em:'🐾', grp:'i', budget:25, subs:[]},
  {id:'Sorties',   em:'🍸', grp:'l', budget:50, subs:[]},
  {id:'Shopping',  em:'🛍️', grp:'l', budget:50, subs:[]},
  {id:'Cadeaux',   em:'🎁', grp:'l', budget:0,  subs:[]},
  {id:'Voyage',    em:'✈️', grp:'l', budget:0,  subs:[]},
  {id:'Divers',    em:'✨', grp:'l', budget:0,  subs:[]},
];
/* organisation proposée : catégories et sous-catégories.
   « from » liste les anciens noms à absorber ; « ren » traduit un ancien nom en sous-catégorie. */
const STRUCT = [
  {id:'Voiture',     em:'🚗', grp:'i', subs:['Essence','Entretien','Assurance'], from:['Voiture','Essence','Parking','PV','Assurance'], ren:{}},
  {id:'Animaux',     em:'🐾', grp:'i', subs:['Nourriture','Vétérinaire'],        from:['Animaux','Nori'], ren:{}},
  {id:'Alimentaire', em:'🍽️', grp:'i', subs:['Courses','Dîner boulot'],          from:['Alimentaire','Courses'], ren:{}},
  {id:'Factures',    em:'🧾', grp:'i', subs:['Alain','Mutuelle'],                from:['Factures','Mutuelle'], ren:{}},
  {id:'Santé',       em:'💊', grp:'i', subs:[],                                  from:['Santé'], ren:{}},
  {id:'Sorties',     em:'🍸', grp:'l', subs:['Restaurant','Fast-food'],          from:['Sorties','Activité'], ren:{}},
  {id:'Shopping',    em:'🛍️', grp:'l', subs:['Vêtements','Soins de soi'],        from:['Shopping','Vetements','Coiffeur','Action'], ren:{'Vetements':'Vêtements','Coiffeur':'Soins de soi'}},
  {id:'Cadeaux',     em:'🎁', grp:'l', subs:['Anniversaire','Noël'],             from:['Cadeaux'], ren:{}},
  {id:'Voyages',     em:'✈️', grp:'l', subs:['Las Vegas','Toscane'],             from:['Voyages','Voyage','Nourriture vacances'], ren:{}},
  {id:'Divers',      em:'✨', grp:'l', subs:[],                                  from:['Divers','Formations'], ren:{}},
];
const STRUCT_CATS = STRUCT.map(s=>({id:s.id, em:s.em, grp:s.grp, budget:0, report:true,
                                    subs:s.subs.map(n=>({n, b:0}))}));

/* une sous-catégorie est un objet {n:nom, b:budget mensuel} */
function normSubs(c){
  if(!Array.isArray(c.subs)) c.subs=[];
  c.subs = c.subs.map(s => typeof s==='string' ? {n:s, b:0} : {n:s.n, b:+s.b||0});
  return c.subs;
}
function subNames(c){ return normSubs(c).map(s=>s.n); }
function subSum(c){ return r2(normSubs(c).reduce((s,x)=>s+(+x.b||0),0)); }
/* le budget de la catégorie devient la somme de ses sous-catégories
   dès qu'au moins l'une d'elles a un budget */
function splitMode(c){ return normSubs(c).some(x=>(+x.b||0)>0); }
function catBudget(c){ return splitMode(c) ? subSum(c) : (+c.budget||0); }
function syncCatBudget(c){ if(splitMode(c)) c.budget = subSum(c); return c.budget; }
const PAY = ['Bancontact','Espèces'];
const GRP_NAME = {i:'Indispensables', l:'Loisirs'};
const KEY = 'finances_v2';

/* ===================== ÉTAT ===================== */
let S = null;
let uid = () => Math.random().toString(36).slice(2,10);

function buildFromSeed(){
  const st = {v:2, solde0:SEED.solde0, cats:CAT_DEF.map(c=>({...c, report:true})), months:{}, tx:[], debts:[]};
  SEED.m.forEach(m=>{
    st.months[m.k] = {
      rev: m.rev.map(r=>({id:uid(), l:r.l, a:r.a})),
      adj: m.adj || 0,
      b: Object.assign({}, m.b)
    };
    m.tx.forEach(t=>{
      st.tx.push({id:uid(), d:m.k+'-01', c:t[0], a:t[1], n:t[2]||'', imp:1});
    });
  });
  if(!SEED.m.length){
    st.cats = STRUCT_CATS.map(c=>({...c, subs:[...c.subs]}));
    const B={Voiture:80, Animaux:25, Alimentaire:84, Factures:38, 'Santé':30, Sorties:50, Shopping:50};
    st.cats.forEach(c=>{ c.budget = B[c.id]||0; });
    st.structApplied = true;
  }
  return st;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const p = JSON.parse(raw); if(p && p.v===2 && p.cats && p.tx) return p; }
  }catch(e){}
  return buildFromSeed();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Sauvegarde impossible — pense à exporter tes données'); }
}

/* ===================== OUTILS ===================== */
const nfEur = new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR',minimumFractionDigits:2});
const nfEur0 = new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const nfNum = new Intl.NumberFormat('fr-BE',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt = n => nfEur.format(n||0);
const fmt0 = n => nfEur0.format(n||0);
const sgn = n => (n>0?'+':'') + nfEur.format(n||0);
const r2 = n => Math.round((n+Number.EPSILON)*100)/100;
/* accepte « 12,50 », « 12.50 », « 1 200,50 », « 12,50 € » */
function numFR(v){
  if(v==null) return NaN;
  const s=String(v).replace(/[\s\u00a0€]/g,'').replace(',','.');
  if(s==='' || !/^-?\d*\.?\d*$/.test(s)) return NaN;
  return parseFloat(s);
}

function mKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function mLabel(k, long){
  const [y,m]=k.split('-').map(Number);
  return new Intl.DateTimeFormat('fr-BE',{month: long?'long':'short', year:'numeric'}).format(new Date(y,m-1,1));
}
function mShort(k){ const [y,m]=k.split('-').map(Number);
  return new Intl.DateTimeFormat('fr-BE',{month:'short'}).format(new Date(y,m-1,1)).replace('.',''); }
function dLabel(iso){
  const d = new Date(iso+'T12:00:00');
  return new Intl.DateTimeFormat('fr-BE',{weekday:'long',day:'numeric',month:'long'}).format(d);
}
function deMois(k){ const s=mLabel(k,true); return (/^[aeiouyâêîôûéè]/i.test(s)?"d'":'de ')+s; }
function addM(k,n){ const [y,m]=k.split('-').map(Number); const d=new Date(y,m-1+n,1); return mKey(d); }
function cmpM(a,b){ return a<b?-1:a>b?1:0; }
function daysIn(k){ const [y,m]=k.split('-').map(Number); return new Date(y,m,0).getDate(); }
function cat(id){ return S.cats.find(c=>c.id===id) || {id, em:'•', grp:'l', budget:0, report:true, subs:[]}; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function el(id){ return document.getElementById(id); }
let toastT;
function toast(msg, undoable){
  const t=el('toast');
  el('toastMsg').textContent=msg;
  const old=t.querySelector('button'); if(old) old.remove();
  if(undoable){
    const b=document.createElement('button');
    b.type='button'; b.textContent='Annuler'; b.setAttribute('data-undo','');
    t.appendChild(b); t.classList.add('act');
  } else t.classList.remove('act');
  t.classList.add('on');
  clearTimeout(toastT);
  toastT=setTimeout(()=>{t.classList.remove('on');t.classList.remove('act');}, undoable?6000:2400);
}

/* ===================== CALCULS ===================== */
let CACHE = {};
function bust(){ CACHE = {}; }

function allMonths(){
  if(CACHE.am) return CACHE.am;
  const set = new Set(Object.keys(S.months));
  S.tx.forEach(t=>set.add(t.d.slice(0,7)));
  set.add(mKey(new Date()));
  const arr=[...set].sort(cmpM);
  // combler les trous pour que la courbe reste continue
  const out=[]; let k=arr[0];
  while(cmpM(k,arr[arr.length-1])<=0){ out.push(k); k=addM(k,1); }
  CACHE.am = out; return out;
}
function txOf(k){
  if(!CACHE.tx) CACHE.tx={};
  if(!CACHE.tx[k]) CACHE.tx[k] = S.tx.filter(t=>t.d.slice(0,7)===k);
  return CACHE.tx[k];
}
/* montant réellement à ta charge : la dépense moins ce qui t'a été remboursé */
function paidBack(txId){
  if(!S.debts) return 0;
  return r2(S.debts.filter(d=>d.tx===txId && d.paid).reduce((s,d)=>s+d.a,0));
}
function netA(t){ return r2(t.a - paidBack(t.id)); }
function agg(k){
  if(!CACHE.ag) CACHE.ag={};
  if(CACHE.ag[k]) return CACHE.ag[k];
  const M = S.months[k] || {rev:[],adj:0,b:{}};
  const byCat={}, byGrp={i:0,l:0}, bySub={}, nbSub={};
  let dep=0;
  txOf(k).forEach(t=>{
    const v=netA(t);
    byCat[t.c]=(byCat[t.c]||0)+v; dep+=v; byGrp[cat(t.c).grp]+=v;
    const key=t.c+'\u0000'+(t.s||'');
    bySub[key]=(bySub[key]||0)+v; nbSub[key]=(nbSub[key]||0)+1;
  });
  const rev = (M.rev||[]).reduce((s,r)=>s+r.a,0);
  const a = {rev:r2(rev), dep:r2(dep), byCat, byGrp, bySub, nbSub, adj:M.adj||0, epargne:r2(rev-dep)};
  CACHE.ag[k]=a; return a;
}
function soldes(){
  if(CACHE.so) return CACHE.so;
  const out={}; let cur=S.solde0;
  allMonths().forEach(k=>{ const a=agg(k); out[k]={debut:r2(cur), fin:r2(cur+a.rev-a.dep+a.adj)}; cur=out[k].fin; });
  CACHE.so=out; return out;
}
function budgetOf(k, id){
  const M=S.months[k];
  if(M && M.b && M.b[id]!=null) return M.b[id];
  return cat(id).budget||0;
}
/* report du reste, cumulé de mois en mois */
function restes(){
  if(CACHE.re) return CACHE.re;
  const mode = S.reportMode || 'pos';
  const out={}; const carry={};
  allMonths().forEach(k=>{
    if(S.reportFrom && k===S.reportFrom) Object.keys(carry).forEach(id=>carry[id]=0);
    const a=agg(k); out[k]={};
    S.cats.forEach(c=>{
      const b=budgetOf(k,c.id);
      const prev = (mode!=='none' && c.report) ? (carry[c.id]||0) : 0;
      const dispo = r2(b + prev);
      const dep = r2(a.byCat[c.id]||0);
      const reste = r2(dispo - dep);
      out[k][c.id]={budget:b, report:prev, dispo, dep, reste};
      let nc = reste;
      if(mode==='pos') nc = Math.max(0, reste);
      if(mode==='none') nc = 0;
      carry[c.id] = (b>0||prev!==0) ? nc : 0;
    });
  });
  CACHE.re=out; return out;
}
function monthProgress(k){
  const today=new Date(), tk=mKey(today);
  if(cmpM(k,tk)<0) return 1;
  if(cmpM(k,tk)>0) return 0;
  return today.getDate()/daysIn(k);
}
function statusOf(dep, dispo, prog){
  if(dispo<=0) return dep>0?'crit':'ok';
  const p=dep/dispo;
  if(p>1) return 'crit';
  if(p > Math.max(prog,0.15)+0.28 || p>0.9) return 'warn';
  return 'ok';
}

/* ===================== GRAPHIQUES (SVG maison) ===================== */
function niceMax(v){
  if(v<=0) return 10;
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  const n=v/p;
  const s = n<=1?1 : n<=1.5?1.5 : n<=2?2 : n<=2.5?2.5 : n<=3?3 : n<=4?4 : n<=5?5 : n<=7.5?7.5 : 10;
  return s*p;
}
function cw(host,min){ const w=host.clientWidth||760; return Math.max(min||300, Math.min(780, Math.round(w))); }
function svgEl(t,at){ const e=document.createElementNS('http://www.w3.org/2000/svg',t); for(const k in at) e.setAttribute(k,at[k]); return e; }

/* Aire : évolution du solde */
function areaChart(host, pts){
  host.innerHTML='';
  if(pts.length<2){ host.innerHTML='<div class="empty">Pas encore assez de mois pour tracer une courbe.</div>'; return; }
  const W=cw(host),H=W<460?176:210,PL=W<460?44:54,PR=12,PT=14,PB=26;
  const vals=pts.map(p=>p.v);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const pad=(hi-lo)*0.15 || Math.max(hi*0.1,10);
  lo=Math.max(0,lo-pad); hi=hi+pad;
  const X=i=> PL + i*(W-PL-PR)/(pts.length-1);
  const Y=v=> PT + (1-(v-lo)/(hi-lo||1))*(H-PT-PB);
  const svg=svgEl('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.setAttribute('aria-label','Évolution du solde');
  const defs=svgEl('defs'); const g=svgEl('linearGradient',{id:'gArea',x1:'0',y1:'0',x2:'0',y2:'1'});
  g.appendChild(svgEl('stop',{offset:'0%','stop-color':'var(--s1)','stop-opacity':'.34'}));
  g.appendChild(svgEl('stop',{offset:'100%','stop-color':'var(--s1)','stop-opacity':'0'}));
  defs.appendChild(g); svg.appendChild(defs);
  for(let i=0;i<=4;i++){
    const v=lo+(hi-lo)*i/4, y=Y(v);
    svg.appendChild(svgEl('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t=svgEl('text',{x:PL-6,y:y+3.5,'text-anchor':'end'}); t.textContent=nfEur0.format(v); svg.appendChild(t);
  }
  const dLine=pts.map((p,i)=>(i?'L':'M')+X(i)+' '+Y(p.v)).join(' ');
  const dArea=dLine+` L${X(pts.length-1)} ${H-PB} L${X(0)} ${H-PB} Z`;
  svg.appendChild(svgEl('path',{d:dArea,fill:'url(#gArea)'}));
  svg.appendChild(svgEl('path',{d:dLine,fill:'none',stroke:'var(--s1)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));
  const step=Math.ceil(pts.length/(W<460?4:7));
  pts.forEach((p,i)=>{
    if(i%step===0||i===pts.length-1){
      const t=svgEl('text',{x:X(i),y:H-8,'text-anchor':'middle',class:'axlabel'}); t.textContent=mShort(p.k); svg.appendChild(t);
    }
  });
  const last=pts.length-1;
  svg.appendChild(svgEl('circle',{cx:X(last),cy:Y(pts[last].v),r:4.5,fill:'var(--s1)',stroke:'var(--surface)','stroke-width':2}));
  const cross=svgEl('line',{x1:0,x2:0,y1:PT,y2:H-PB,stroke:'var(--border-strong)','stroke-width':1,opacity:0});
  const mark=svgEl('circle',{r:5,fill:'var(--s1)',stroke:'var(--surface)','stroke-width':2,opacity:0});
  svg.appendChild(cross); svg.appendChild(mark);
  host.appendChild(svg);
  const tip=document.createElement('div'); tip.className='tip'; host.appendChild(tip);
  const hit=svgEl('rect',{x:0,y:0,width:W,height:H,fill:'transparent'}); svg.appendChild(hit);
  function move(ev){
    const r=svg.getBoundingClientRect();
    const cx=(ev.touches?ev.touches[0].clientX:ev.clientX)-r.left;
    const i=Math.max(0,Math.min(pts.length-1,Math.round((cx/r.width*W-PL)/((W-PL-PR)/(pts.length-1)))));
    const p=pts[i];
    cross.setAttribute('x1',X(i)); cross.setAttribute('x2',X(i)); cross.setAttribute('opacity',.8);
    mark.setAttribute('cx',X(i)); mark.setAttribute('cy',Y(p.v)); mark.setAttribute('opacity',1);
    tip.innerHTML=`<div class="th">${mLabel(p.k,true)}</div><div class="tr"><span>Solde</span><span>${fmt(p.v)}</span></div>`+
      (p.ep!=null?`<div class="tr"><span>Épargne</span><span>${sgn(p.ep)}</span></div>`:'');
    tip.style.opacity=1;
    const px=X(i)/W*r.width;
    tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+'px';
    tip.style.top=Math.max(0,Y(p.v)/H*r.height-tip.offsetHeight-12)+'px';
  }
  function out(){ tip.style.opacity=0; cross.setAttribute('opacity',0); mark.setAttribute('opacity',0); }
  svg.addEventListener('mousemove',move); svg.addEventListener('mouseleave',out);
  svg.addEventListener('touchstart',move,{passive:true}); svg.addEventListener('touchmove',move,{passive:true}); svg.addEventListener('touchend',out);
}

/* Barres +/- : épargne mensuelle */
function barsChart(host, pts){
  host.innerHTML='';
  if(!pts.length){ host.innerHTML='<div class="empty">Aucune donnée.</div>'; return; }
  const W=cw(host),H=W<460?170:200,PL=W<460?44:54,PR=12,PT=12,PB=26;
  const maxV=Math.max(...pts.map(p=>Math.abs(p.v)),1);
  const M=niceMax(Math.max(maxV,20));
  const hasNeg=pts.some(p=>p.v<0);
  const lo=hasNeg?-M:0, hi=M;
  const Y=v=> PT+(1-(v-lo)/(hi-lo))*(H-PT-PB);
  const bw=Math.min(38,(W-PL-PR)/pts.length-6);
  const X=i=> PL+(i+0.5)*(W-PL-PR)/pts.length;
  const svg=svgEl('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.setAttribute('aria-label','Épargne par mois');
  const ticks=hasNeg?[lo,lo/2,0,hi/2,hi]:[0,hi/4,hi/2,hi*3/4,hi];
  ticks.forEach(v=>{
    const y=Y(v);
    svg.appendChild(svgEl('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:v===0?'var(--border-strong)':'var(--grid)','stroke-width':1}));
    const t=svgEl('text',{x:PL-6,y:y+3.5,'text-anchor':'end'}); t.textContent=nfEur0.format(v); svg.appendChild(t);
  });
  const tip=document.createElement('div'); tip.className='tip';
  pts.forEach((p,i)=>{
    const y0=Y(0), y1=Y(p.v);
    const top=Math.min(y0,y1), h=Math.max(2,Math.abs(y1-y0));
    const rect=svgEl('rect',{x:X(i)-bw/2,y:top,width:bw,height:h,rx:4,
      fill:p.v<0?'var(--crit)':'var(--s1)'});
    rect.style.cursor='default';
    rect.addEventListener('mouseenter',()=>{
      const r=svg.getBoundingClientRect();
      tip.innerHTML=`<div class="th">${mLabel(p.k,true)}</div><div class="tr"><span>Épargne</span><span>${sgn(p.v)}</span></div>`+
        `<div class="tr"><span>Revenus</span><span>${fmt(p.rev)}</span></div><div class="tr"><span>Dépenses</span><span>${fmt(p.dep)}</span></div>`;
      tip.style.opacity=1;
      const px=X(i)/W*r.width;
      tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+'px';
      tip.style.top=Math.max(0,top/H*r.height-tip.offsetHeight-10)+'px';
    });
    rect.addEventListener('mouseleave',()=>tip.style.opacity=0);
    svg.appendChild(rect);
  });
  const step=Math.ceil(pts.length/(W<460?4:8));
  pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1){
    const t=svgEl('text',{x:X(i),y:H-8,'text-anchor':'middle',class:'axlabel'}); t.textContent=mShort(p.k); svg.appendChild(t);} });
  host.appendChild(svg); host.appendChild(tip);
}

/* Barres groupées : revenus vs dépenses */
function groupedChart(host, pts){
  host.innerHTML='';
  if(!pts.length){ host.innerHTML='<div class="empty">Aucune donnée.</div>'; return; }
  const W=cw(host),H=W<460?176:210,PL=W<460?44:54,PR=12,PT=12,PB=26;
  const M=niceMax(Math.max(...pts.flatMap(p=>[p.rev,p.dep]),20));
  const Y=v=> PT+(1-v/M)*(H-PT-PB);
  const slot=(W-PL-PR)/pts.length;
  const bw=Math.min(16,slot/2-3);
  const X=i=> PL+(i+0.5)*slot;
  const svg=svgEl('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.setAttribute('aria-label','Revenus et dépenses par mois');
  for(let i=0;i<=4;i++){ const v=M*i/4,y=Y(v);
    svg.appendChild(svgEl('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t=svgEl('text',{x:PL-6,y:y+3.5,'text-anchor':'end'}); t.textContent=nfEur0.format(v); svg.appendChild(t);}
  const tip=document.createElement('div'); tip.className='tip';
  pts.forEach((p,i)=>{
    [['rev','var(--s1)',-1],['dep','var(--s2)',1]].forEach(([k,col,side])=>{
      const v=p[k], y=Y(v), h=Math.max(2,(H-PB)-y);
      const x=X(i)+side*(bw/2+1)-bw/2;
      const rect=svgEl('rect',{x,y,width:bw,height:h,rx:3.5,fill:col});
      rect.addEventListener('mouseenter',()=>{
        const r=svg.getBoundingClientRect();
        tip.innerHTML=`<div class="th">${mLabel(p.k,true)}</div><div class="tr"><span>Revenus</span><span>${fmt(p.rev)}</span></div><div class="tr"><span>Dépenses</span><span>${fmt(p.dep)}</span></div><div class="tr"><span>Épargne</span><span>${sgn(p.rev-p.dep)}</span></div>`;
        tip.style.opacity=1;
        const px=X(i)/W*r.width;
        tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+'px';
        tip.style.top=Math.max(0,Math.min(y,Y(p.rev))/H*r.height-tip.offsetHeight-10)+'px';
      });
      rect.addEventListener('mouseleave',()=>tip.style.opacity=0);
      svg.appendChild(rect);
    });
  });
  const step=Math.ceil(pts.length/(W<460?4:8));
  pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1){
    const t=svgEl('text',{x:X(i),y:H-8,'text-anchor':'middle',class:'axlabel'}); t.textContent=mShort(p.k); svg.appendChild(t);} });
  host.appendChild(svg); host.appendChild(tip);
}

let CUR = null;          // mois sélectionné
let TAB = 'dash';
let FILTER = null;       // filtre catégorie (onglet Dépenses)
let FSUB = null;         // filtre sous-catégorie
let OPEN = {i:true, l:true};   // sections dépliées sur l'accueil
let HCAT = 'Courses';    // catégorie suivie dans l'historique

function defaultMonth(){
  const ms=allMonths(), tk=mKey(new Date());
  return ms.indexOf(tk)>=0 ? tk : ms[ms.length-1];
}
function windowMonths(n){
  const ms=allMonths(); const i=ms.indexOf(CUR);
  const end=i<0?ms.length-1:i;
  return ms.slice(Math.max(0,end-n+1), end+1);
}

function renderHero(){
  const so=soldes(), a=agg(CUR);
  const s=so[CUR];
  el('heroVal').textContent=fmt(s.fin);
  const today=new Date();
  el('heroDate').textContent = CUR===mKey(today)
    ? new Intl.DateTimeFormat('fr-BE',{day:'numeric',month:'long'}).format(today)
    : ('fin '+mLabel(CUR,true));
  const d=r2(s.fin-s.debut);
  const up = d>=0;
  el('heroDelta').innerHTML=
    `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${up?'<path d="m6 15 6-6 6 6"/>':'<path d="m6 9 6 6 6-6"/>'}</svg> ${sgn(d)} ce mois-ci`;
  el('curMLbl').textContent=mLabel(CUR,true);
  const ms=allMonths();
  el('prevM').disabled = ms.indexOf(CUR)<=0;
  el('nextM').disabled = ms.indexOf(CUR)>=ms.length-1;
}

/* ---------- Tableau de bord ---------- */

  const hors = r2(a.dep - S.cats.reduce((s,c)=>s+R[c.id].dep,0));

  let html='';

  if(!S.structApplied && S.tx.length){
    html+=`<div class="banner"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:1px" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M7 12h14M11 18h10"/></svg>

  }

    html+=`<button class="banner owe-b" data-tab="debt" style="width:100%;text-align:left">

      <div>On te doit <b>${fmt(owed)}</b> — ${debts().filter(d=>!d.paid).length} ligne(s) en attente. Voir le détail.</div>
      <svg class="bx" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </button>`;
  }
  if(!S.tx.length && !a.rev){
    html+=`<div class="banner"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:1px" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-4.5 0-8-3.2-8-7.6C4 8.6 8 4.5 12 2c4 2.5 8 6.6 8 11.4C20 17.8 16.5 21 12 21z"/></svg>
    <div><b>Bienvenue.</b> Si tu as un fichier de sauvegarde, va dans <b>Réglages → Importer un fichier</b> pour retrouver ton historique. Sinon, indique ton solde de départ dans Réglages et commence à saisir.</div></div>`;
  }
  if(!a.rev){
    html+=`<div class="banner"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01" stroke-linecap="round"/></svg>
    <div>Aucun revenu enregistré pour ${mLabel(CUR,true)}. <button class="btn sm" style="margin-left:6px" data-act="addrev">Ajouter mon salaire</button></div></div>`;
  }

  const CHEV='<svg class="tchev" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
  html+=`<div class="tiles">
    <button class="tile tile-btn" data-jump="tx:cardRev"><div class="t"><span class="dot" style="background:var(--s1)"></span>Revenus${CHEV}</div><div class="v tnum">${fmt(a.rev)}</div><div class="h">${(S.months[CUR]?.rev||[]).length} entrée(s) — voir le détail</div></button>
    <button class="tile tile-btn" data-jump="tx:cardDep"><div class="t"><span class="dot" style="background:var(--s2)"></span>Dépenses${CHEV}</div><div class="v tnum">${fmt(a.dep)}</div><div class="h">${txOf(CUR).length} opération(s) — voir le détail</div></button>

  </div>`;

  /* jauge globale */
  const pct = totB>0? Math.min(100, totD/totB*100) : 0;
  const over = S.cats.filter(c=>R[c.id].reste<-0.005 && (R[c.id].budget>0||R[c.id].report));
  const st = over.length? 'crit' : statusOf(totD, totB, prog);
  const stLbl = over.length? (over.length===1? '1 poste dépassé' : over.length+' postes dépassés')
              : st==='warn'? 'Attention' : 'Dans les clous';
  html+=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap">

      <div class="pill ${st}">${stLbl}</div>
    </div>
    <div class="track" style="height:12px;margin-top:14px"><div class="fill" style="width:${pct}%;background:${pct>=100?'var(--crit)':st==='warn'?'var(--warn)':'var(--brand)'}"></div></div>
    <div class="brow-foot"><span>${fmt(totD)} dépensés</span><span>${totB>0?Math.round(pct)+' % du budget · ':''}${Math.round(prog*100)} % du mois écoulé</span></div>`;

  if(hors>0.005) html+=`<div class="brow-foot" style="margin-top:14px"><span>Dépenses hors catégories actives</span><span class="tnum">${fmt(hors)}</span></div>`;
  html+=`</div>`;

  const GMETA={
    i:{cls:'gi', nom:'Indispensables', sous:'Ce qui doit être payé',
       ico:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>'},
    l:{cls:'gl', nom:'Loisirs', sous:'Ce qui fait plaisir',
       ico:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.35-9.33-8.5A5.2 5.2 0 0 1 12 6.5a5.2 5.2 0 0 1 9.33 6C19 16.65 12 21 12 21z"/></svg>'}
  };
  const CHEVD='<svg class="gchev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
  ['i','l'].forEach(g=>{
    const cs=S.cats.filter(c=>c.grp===g);
    if(!cs.length) return;
    const gd=r2(cs.reduce((s,c)=>s+R[c.id].dep,0)), gb=r2(cs.reduce((s,c)=>s+Math.max(0,R[c.id].dispo),0));
    const M=GMETA[g], ouvert=!!OPEN[g];
    html+=`<div class="card gcard ${M.cls}${ouvert?' open':''}">
      <div class="ghead" data-gtog="${g}" role="button" aria-expanded="${ouvert}">
        <span class="gicon">${M.ico}</span>
        <div class="gt"><h2>${M.nom}</h2><p class="gs">${M.sous}</p></div>
        <div class="gv tnum">${fmt(gd)}${gb>0?`<span>sur ${fmt(gb)}</span>`:''}</div>
        ${CHEVD}
      </div>`;
    if(gb>0){
      const gp=Math.min(100, gd/gb*100);
      const gst=statusOf(gd,gb,prog);
      html+=`<div class="track" style="height:10px;margin:12px 0 4px"><div class="fill" style="width:${gp}%;background:${gp>=100?'var(--crit)':gst==='warn'?'var(--warn)':'var(--gc)'}"></div></div>`;
    }
    if(!ouvert){ html+='</div>'; return; }
    cs.slice().sort((x,y)=>R[y.id].dep-R[x.id].dep).forEach(c=>{
      const r=R[c.id];
      const p = r.dispo>0 ? Math.min(100, r.dep/r.dispo*100) : (r.dep>0?100:0);
      const s2 = statusOf(r.dep, r.dispo, prog);
      const col = s2==='crit'?'var(--crit)':s2==='warn'?'var(--warn)':'var(--gc)';
      /* sous-catégories réellement utilisées ce mois-ci */
      const used=[];
      Object.keys(a.bySub||{}).forEach(k2=>{
        const [cc,ss]=k2.split('\u0000');
        if(cc===c.id && Math.abs(a.bySub[k2])>0.005) used.push({s:ss, v:r2(a.bySub[k2]), n:a.nbSub[k2]});
      });
      used.sort((x,y)=>y.v-x.v);
      const depliable = used.some(u=>u.s) || used.length>1;
      const ouv = !!OPEN['c:'+c.id];
      html+=`<${depliable?`button type="button" class="brow brow-btn${ouv?' open':''}" data-ctog="${esc(c.id)}"`:'div class="brow"'}>
        <div class="brow-head">
          <div class="brow-name"><span class="em">${c.em}</span>${esc(c.id)}${depliable?CHEV_S:''}</div>
          <div class="brow-val tnum"><b>${fmt(r.dep)}</b>${r.dispo>0?' / '+fmt(r.dispo):''}</div>
        </div>
        <div class="track"><div class="fill" style="width:${p}%;background:${col}"></div></div>
        <div class="brow-foot">
          <span>${r.budget>0||r.report? 'Budget '+nfNum.format(r.budget)+' €'+(r.report? (r.report>0?' + ':' − ')+nfNum.format(Math.abs(r.report))+' € reportés':'') : 'Sans budget'}</span>
          <span class="tnum" style="color:${r.reste<0?'var(--crit)':'var(--text-3)'}">${r.dispo>0? (r.reste<0? nfNum.format(-r.reste)+' € de trop' : 'reste '+fmt(r.reste)) : (r.dep>0&&r.budget>0?'budget épuisé':'')}</span>
        </div>
      </${depliable?'button':'div'}>`;
      if(depliable && ouv){
        html+='<div class="subs">';
        used.forEach(u=>{
          html+=`<button type="button" class="srow" data-catf="${esc(c.id)}" data-subf="${esc(u.s)}">
            <span class="sn">${u.s?esc(u.s):'Sans sous-catégorie'}<span class="sc"> · ${u.n} opération${u.n>1?'s':''}</span></span>
            <span class="sa tnum">${fmt(u.v)}</span>
            <svg class="schev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>`;
        });
        html+=`<button type="button" class="srow all" data-catf="${esc(c.id)}">
          <span class="sn">Voir toutes les dépenses</span>
          <svg class="schev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button></div>`;
      }
    });
    html+='</div>';
  });

  /* graphiques */
  html+=`<div class="card"><h2>Évolution du solde</h2><p class="sub">Solde en fin de mois, sur les 18 derniers mois</p><div class="chartbox" id="chSolde"></div></div>`;
  html+=`<div class="grid g2">
    <div class="card"><h2>Épargne mensuelle</h2><p class="sub">Revenus moins dépenses, mois par mois</p><div class="chartbox" id="chEp"></div></div>
    <div class="card"><h2>Où part l'argent</h2><p class="sub">${mLabel(CUR,true)}</p><div id="chSplit"></div></div>
  </div>`;

  el('p-dash').innerHTML=html;

  const win=windowMonths(18);
  areaChart(el('chSolde'), win.map(k=>({k, v:so[k].fin, ep:agg(k).epargne})));
  barsChart(el('chEp'), windowMonths(12).map(k=>{const x=agg(k);return {k,v:x.epargne,rev:x.rev,dep:x.dep};}));

function renderSplit(host, a){
  const tot=a.dep||1;
  const gi=a.byGrp.i||0, gl=a.byGrp.l||0;
  let h=`<div class="track" style="height:14px;margin-bottom:12px">
    <div class="fill" style="width:${gi/tot*100}%;background:var(--indisp)"></div>
    <div class="fill" style="width:${gl/tot*100}%;background:var(--loisir)"></div></div>
    <div class="legend"><span><i style="background:var(--indisp)"></i>Indispensables — <b class="tnum">${fmt(gi)}</b></span><span><i style="background:var(--loisir)"></i>Loisirs — <b class="tnum">${fmt(gl)}</b></span></div>`;
  const rows=Object.entries(a.byCat).sort((x,y)=>y[1]-x[1]).slice(0,6);
  if(rows.length){
    const mx=rows[0][1];
    h+='<div style="margin-top:18px">';
    rows.forEach(([id,v])=>{
      const c=cat(id);
      h+=`<button type="button" class="brow brow-btn" data-catf="${esc(id)}" style="padding:8px">
        <div class="brow-head" style="margin-bottom:5px"><div class="brow-name" style="font-size:13.5px"><span class="em">${c.em}</span>${esc(id)}${CHEV_S}</div><div class="brow-val tnum"><b>${fmt(v)}</b> · ${Math.round(v/tot*100)} %</div></div>
        <div class="track" style="height:7px"><div class="fill" style="width:${v/mx*100}%;background:${c.grp==='i'?'var(--indisp)':'var(--loisir)'}"></div></div></button>`;
    });
    h+='</div>';
  } else h+='<div class="empty"><span class="big">🌱</span>Aucune dépense ce mois-ci.</div>';
  host.innerHTML=h;
}

/* ---------- Dépenses ---------- */
function renderTx(){
  const a=agg(CUR);
  const list=txOf(CUR).slice().sort((x,y)=> x.d===y.d ? 0 : (x.d<y.d?1:-1));
  const shown=FILTER? list.filter(t=>t.c===FILTER && (FSUB===null || (t.s||'')===FSUB)) : list;
  let html='';

  html+=`<div class="card" id="cardRev">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div><h2>Revenus ${deMois(CUR)}</h2><p class="sub" style="margin-bottom:0">Total ${fmt(a.rev)}</p></div>
      <button class="btn sm primary" data-act="addrev">+ Revenu</button>
    </div>`;
  const revs=(S.months[CUR]?.rev)||[];
  if(revs.length){
    revs.forEach(r=>{
      const selR=SEL.has('r:'+r.id);
      html+=`<div class="tx${HILITE===r.id?' hl':''}${selR?' sel':''}" id="r-${r.id}" data-editrev="${r.id}"><div class="ico">${selR?'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':'💶'}</div><div class="m"><div class="n">${esc(r.l)}</div>${(r.n||r.pm)?`<div class="c">${[r.n?esc(r.n):'', r.pm?esc(r.pm):''].filter(Boolean).join(' · ')}</div>`:''}</div><div class="a tnum" style="color:var(--brand)">${sgn(r.a)}</div>
      <button class="del" data-delrev="${r.id}" aria-label="Supprimer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button></div>`;
    });
  } else html+='<div class="empty">Aucun revenu enregistré ce mois-ci.</div>';
  if((S.months[CUR]?.adj)) html+=`<div class="brow-foot" style="margin-top:10px"><span>Ajustement de solde</span><span class="tnum">${sgn(S.months[CUR].adj)}</span></div>`;
  html+='</div>';

  html+=`<div class="card" id="cardDep">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <div><h2>Dépenses ${deMois(CUR)}</h2><p class="sub" style="margin-bottom:0">${list.length} opération(s) · ${fmt(a.dep)}</p></div>
      <button class="btn sm primary" data-act="addtx">+ Dépense</button>
    </div>
    <div class="chips" style="margin-bottom:6px">
      <button class="chip" data-filter="" aria-pressed="${!FILTER}">Tout</button>`;
  S.cats.forEach(c=>{
    const v=r2(a.byCat[c.id]||0);
    if(!v && FILTER!==c.id) return;
    html+=`<button class="chip" data-filter="${esc(c.id)}" aria-pressed="${FILTER===c.id&&FSUB===null}">${c.em} ${esc(c.id)} · ${nfNum.format(v)} €</button>`;
  });
  html+='</div>';
  if(FILTER){
    const cc=cat(FILTER);
    const used=[];
    Object.keys(a.bySub||{}).forEach(k2=>{
      const [c1,s1]=k2.split('\u0000');
      if(c1===FILTER && Math.abs(a.bySub[k2])>0.005) used.push({s:s1, v:r2(a.bySub[k2])});
    });
    used.sort((x,y)=>y.v-x.v);
    if(used.length>1 || (used.length===1 && used[0].s)){
      html+=`<div class="chips" style="margin:2px 0 6px">`;
      used.forEach(u=>{
        html+=`<button class="chip" style="font-size:12.5px;padding:6px 11px" data-filter="${esc(FILTER)}" data-subf="${esc(u.s)}" aria-pressed="${FSUB===u.s}">${u.s?esc(u.s):'Sans sous-catégorie'} · ${nfNum.format(u.v)} €</button>`;
      });
      html+='</div>';
    }
  }

  if(!shown.length){
    html+='<div class="empty"><span class="big">🌿</span>Aucune dépense ici. Appuie sur « Dépense » pour en ajouter une.</div>';
  } else {
    let day=null;
    shown.forEach(t=>{
      if(t.d!==day){

  let html='';

      html+=`<div class="person"><div class="pn"><span class="pav">${esc(initials(w))}</span>${esc(w)}</div><div class="pt tnum">${fmt(st)}</div></div>`;

          <div class="a tnum">${fmt(d.a)}</div>

    html+=`<div class="card"><h2>Réglé</h2><p class="sub">Chaque remboursement a été ajouté à tes revenus du mois.</p>`;

        <div class="a tnum">${fmt(d.a)}</div>

function catChart(host, ms){
  host.innerHTML='';
  const R=restes();
  const pts=ms.map(k=>({k, v:r2(agg(k).byCat[HCAT]||0), b:R[k][HCAT]?R[k][HCAT].budget:0}));
  if(!pts.length){ host.innerHTML='<div class="empty">Aucune donnée.</div>'; return; }
  const W=cw(host),H=W<460?170:200,PL=W<460?44:54,PR=12,PT=12,PB=26;
  const M=niceMax(Math.max(...pts.flatMap(p=>[p.v,p.b]),20));
  const Y=v=>PT+(1-v/M)*(H-PT-PB);
  const slot=(W-PL-PR)/pts.length, bw=Math.max(4,Math.min(34,slot-8)), X=i=>PL+(i+0.5)*slot;
  const svg=svgEl('svg',{class:'chart',viewBox:`0 0 ${W} ${H}`,role:'img'});
  svg.setAttribute('aria-label','Dépenses mensuelles de la catégorie '+HCAT);
  for(let i=0;i<=4;i++){const v=M*i/4,y=Y(v);
    svg.appendChild(svgEl('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:'var(--grid)','stroke-width':1}));
    const t=svgEl('text',{x:PL-6,y:y+3.5,'text-anchor':'end'});t.textContent=nfEur0.format(v);svg.appendChild(t);}
  const tip=document.createElement('div');tip.className='tip';
  pts.forEach((p,i)=>{
    const y=Y(p.v),h=Math.max(2,(H-PB)-y);
    const over=p.b>0&&p.v>p.b;
    const rect=svgEl('rect',{x:X(i)-bw/2,y,width:bw,height:h,rx:4,fill:over?'var(--crit)':'var(--s1)'});
    rect.addEventListener('mouseenter',()=>{
      const r=svg.getBoundingClientRect();
      tip.innerHTML=`<div class="th">${mLabel(p.k,true)}</div><div class="tr"><span>${esc(HCAT)}</span><span>${fmt(p.v)}</span></div>`+(p.b?`<div class="tr"><span>Budget</span><span>${fmt(p.b)}</span></div>`:'');
      tip.style.opacity=1;
      const px=X(i)/W*r.width;
      tip.style.left=Math.max(4,Math.min(r.width-tip.offsetWidth-4,px-tip.offsetWidth/2))+'px';
      tip.style.top=Math.max(0,y/H*r.height-tip.offsetHeight-10)+'px';
    });
    rect.addEventListener('mouseleave',()=>tip.style.opacity=0);
    svg.appendChild(rect);
    if(p.b>0){
      svg.appendChild(svgEl('line',{x1:X(i)-bw/2-2,x2:X(i)+bw/2+2,y1:Y(p.b),y2:Y(p.b),stroke:'var(--text-3)','stroke-width':2,'stroke-linecap':'round','stroke-dasharray':'3 3'}));
    }
  });
  const step=Math.ceil(pts.length/(W<460?4:8));
  pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1){
    const t=svgEl('text',{x:X(i),y:H-8,'text-anchor':'middle',class:'axlabel'});t.textContent=mShort(p.k);svg.appendChild(t);}});
  host.appendChild(svg); host.appendChild(tip);
  const lg=document.createElement('div'); lg.className='legend';
  lg.innerHTML=`<span><i style="background:var(--s1)"></i>Dépensé</span><span><i style="background:var(--crit)"></i>Budget dépassé</span><span><i style="background:var(--text-3);height:2px;border-radius:2px"></i>Budget du mois</span>`;
  host.appendChild(lg);
}

const REV_PRESETS=['Salaire','Chèques repas','Prime','Remboursement','Autre'];
let KIND='dep', EDIT=null;
function setKind(k){
  KIND=k;
  document.querySelectorAll('[data-kind]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.kind===k)));
  el('wrapCats').hidden = k!=='dep';

  if(!EDIT) el('txTitle').textContent = k==='dep' ? 'Nouvelle dépense' : 'Nouveau revenu';
}
let SHARE='equal', DROWS=[];
function renderDebtRows(){
  el('debtList').innerHTML = DROWS.map((r,i)=>`
    <div class="drow">
      <input type="text" data-dw="${i}" value="${esc(r.who)}" placeholder="Qui ?" list="whoList" aria-label="Personne ${i+1}">
      <input type="text" inputmode="decimal" autocomplete="off" data-da="${i}" value="${esc(r.a)}" placeholder="0,00" style="text-align:right" aria-label="Montant dû ${i+1}">
      <button type="button" class="del" data-drm="${i}" aria-label="Retirer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
    </div>`).join('');
  updateLeft();
}
function debtSum(){ return r2(DROWS.reduce((s,r)=>{const v=numFR(r.a); return s+(isFinite(v)?v:0);},0)); }
function updateLeft(){
  const tot=numFR(el('txAmount').value);
  const due=debtSum();
  if(!isFinite(tot)||tot<=0){ el('debtLeft').textContent=''; return; }
  const mine=r2(tot-due);
  el('debtLeft').innerHTML = mine<0
    ? `<span style="color:var(--crit);font-weight:650">Le total dû (${fmt(due)}) dépasse la dépense de ${fmt(-mine)}.</span>`
    : `On te doit <b>${fmt(due)}</b> · il te reste <b>${fmt(mine)}</b> à ta charge.`;
}
function applyShare(){
  const tot=numFR(el('txAmount').value);
  if(!isFinite(tot)||tot<=0||!DROWS.length||SHARE==='custom'){ updateLeft(); return; }
  const per = SHARE==='equal' ? r2(tot/(DROWS.length+1)) : r2(tot/DROWS.length);
  DROWS.forEach(r=>r.a=per.toFixed(2).replace('.',','));
  renderDebtRows();
}
function setShare(s){
  SHARE=s;
  document.querySelectorAll('[data-share]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.share===s)));
  if(s==='custom') updateLeft(); else applyShare();
}
function addDebtRow(who,a){
